name: Сборка APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Весовщики · Мираж → APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Исходники
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Зависимости
        working-directory: apk
        run: npm install --no-audit --no-fund

      - name: Ключ подписи (если задан в Secrets)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: apk
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mirazh.keystore
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/apk/mirazh.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-mirazh}
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Сборка
        working-directory: apk
        run: npm run apk -- --ci

      - name: Имя артефакта
        id: meta
        run: |
          V=$(node -p "require('./apk/package.json').version")
          if [ -f apk/keystore.properties ]; then K=release; else K=debug; fi
          echo "name=mirazh-$V-$K" >> "$GITHUB_OUTPUT"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: apk/dist/*.apk
          if-no-files-found: error
          retention-days: 30

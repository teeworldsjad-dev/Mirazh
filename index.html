<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090c12">
<title>Весовщики: Мираж</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#090c12;--bg2:#101722;--surface:#151e2b;--surface2:#1d2938;--overlay:#263548;--scrim:rgba(3,5,9,.82);
  --sand:#efbd4d;--sand2:#c58d24;--rust:#d16034;--diesel:#3d8798;--acid:#a3e24b;--magenta:#c45de0;
  --ok:#4fc06d;--warn:#eda23a;--bad:#e84b3f;--info:#58a9ee;
  --text:#f5f0e3;--muted:#91a0b2;--line:rgba(239,189,77,.2);
  --app-h:100dvh;--tg-top:0px;--tg-bot:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);touch-action:manipulation}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(110% 70% at 8% -10%,rgba(239,189,77,.17),transparent 58%),
  radial-gradient(90% 60% at 95% 4%,rgba(61,135,152,.18),transparent 60%),
  radial-gradient(80% 60% at 50% 115%,rgba(209,96,52,.14),transparent 62%),
  linear-gradient(180deg,#090c12,#0d131c 58%,#090c12)}
body:after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.app{position:relative;z-index:2;width:100%;max-width:560px;margin:0 auto;height:100vh;height:100dvh;height:var(--app-h);
  display:flex;flex-direction:column;overflow:hidden;padding:calc(8px + var(--tg-top)) 9px calc(8px + var(--tg-bot))}
.app.shake{animation:shake .32s ease}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.top{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding-bottom:7px}
.logo{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);
  background:linear-gradient(135deg,rgba(239,189,77,.16),rgba(209,96,52,.09));font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--sand);white-space:nowrap}
.logo i{width:6px;height:6px;border-radius:50%;background:var(--sand);box-shadow:0 0 10px var(--sand)}
.grow{flex:1}
.ic{height:36px;min-width:36px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:linear-gradient(160deg,var(--surface2),var(--surface));
  color:var(--text);font-size:14px;font-weight:900;display:grid;place-items:center;cursor:pointer}
.ic:active{transform:scale(.92)}.ic.off{opacity:.6;color:var(--muted)}.ic.on{color:var(--acid);border-color:rgba(163,226,75,.5)}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.game{flex:1;min-height:0;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:6px}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.pill{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:5px 3px;text-align:center;min-height:38px}
.pill small{display:block;font-size:8.5px;font-weight:800;color:var(--muted);white-space:nowrap;margin-bottom:2px}
.pill b{font-size:13px;line-height:1;font-variant-numeric:tabular-nums}
.pill i{position:absolute;left:0;bottom:0;height:2px;transition:width .35s ease}
.p-money b{color:var(--sand)}.p-loy b{color:var(--info)}.p-mood b{color:var(--magenta)}.p-theft b{color:var(--rust)}
.p-drunk b{color:var(--warn)}.p-energy b{color:var(--ok)}.p-food b{color:#dca06c}.p-pat b{color:var(--diesel)}
.pill.hit{animation:hit .4s ease}
@keyframes hit{40%{transform:scale(1.07);box-shadow:0 0 0 5px rgba(239,189,77,.12)}}
.strip{display:flex;align-items:center;gap:6px;min-height:24px}
.mod{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:rgba(61,135,152,.15);
  border:1px solid rgba(61,135,152,.3);font-size:10px;font-weight:800;color:#c5e7ee;white-space:nowrap}
.road{position:relative;flex:1;height:20px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);overflow:hidden}
.road i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(209,96,52,.5),rgba(239,189,77,.5));transition:width .4s ease}
.road b{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:12px;transition:left .4s ease}
.road u{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:#fff;text-shadow:0 1px 3px #000}
.goals{display:flex;gap:4px;overflow:hidden;min-height:22px}
.goal{flex:1;min-width:0;padding:5px 6px;border-radius:9px;border:1px dashed rgba(255,255,255,.15);background:rgba(255,255,255,.03);
  font-size:9px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal.done{border-style:solid;border-color:rgba(79,192,109,.5);background:rgba(79,192,109,.13);color:#c8f3d7}
.stage{min-height:0;position:relative;display:flex}
.card{width:100%;height:100%;min-height:0;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(21,30,43,.97));box-shadow:0 14px 34px rgba(0,0,0,.5);
  animation:cardIn .26s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column}
@keyframes cardIn{0%{opacity:0;transform:translateY(12px) scale(.97)}100%{opacity:1;transform:none}}
.truck{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;padding:11px;flex:1;min-height:0}
.facebox{border-radius:16px;background:radial-gradient(circle at 30% 25%,rgba(239,189,77,.22),transparent 58%),var(--surface2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid rgba(255,255,255,.07)}
.facebox .truckem{font-size:34px;line-height:1}.facebox .driverem{font-size:24px;line-height:1}
.info{min-width:0;display:flex;flex-direction:column;gap:6px}
.kicker{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
.title{font-size:20px;font-weight:900;line-height:1.05;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title em{font-style:normal;font-size:12px;color:var(--muted);font-weight:700}
.chips{display:flex;gap:4px;flex-wrap:wrap;max-height:44px;overflow:hidden}
.chip{font-size:9px;font-weight:800;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);color:var(--muted);white-space:nowrap}
.chip.ok{color:#c8f3d7;border-color:rgba(79,192,109,.4);background:rgba(79,192,109,.12)}
.chip.warn{color:#ffdda6;border-color:rgba(237,162,58,.4);background:rgba(237,162,58,.12)}
.chip.bad{color:#ffb8b1;border-color:rgba(232,75,63,.4);background:rgba(232,75,63,.12)}
.chip.info{color:#c6e2fb;border-color:rgba(88,169,238,.4);background:rgba(88,169,238,.12)}
.desc{font-size:11.5px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.quote{font-size:11.5px;line-height:1.3;color:var(--sand);font-weight:700;border-left:2px solid var(--rust);padding-left:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc{margin-top:auto;font-size:9.5px;color:#9fb2c6;background:rgba(88,169,238,.07);border:1px dashed rgba(88,169,238,.25);border-radius:9px;padding:5px 7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,monospace}
.eventcard{padding:13px;gap:8px;display:flex;flex-direction:column;flex:1;min-height:0}
.eventhead{display:flex;align-items:center;gap:10px}
.eventem{width:52px;height:52px;flex:0 0 52px;border-radius:15px;display:grid;place-items:center;font-size:29px;background:var(--surface2);border:1px solid rgba(255,255,255,.08)}
.eventtitle{font-size:20px;font-weight:900;line-height:1.08;letter-spacing:-.02em}
.eventtext{font-size:12.5px;line-height:1.42;color:var(--muted);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.eventtag{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
.controls{display:grid;gap:5px;flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grid.two{grid-template-columns:1fr 1fr}
button{position:relative;overflow:hidden;font-family:inherit;border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:9px 7px;
  font-size:12px;font-weight:900;color:#fff;background:linear-gradient(160deg,var(--overlay),var(--surface2));cursor:pointer;min-height:44px;line-height:1.1}
button:active{transform:scale(.96)}button:disabled{opacity:.42;filter:grayscale(.6)}
button small{display:block;font-size:8.5px;font-weight:700;opacity:.82;margin-top:3px;line-height:1.15}
.b-work{background:linear-gradient(160deg,#43a862,#2b7548);border-color:rgba(79,192,109,.5)}
.b-bribe{background:linear-gradient(160deg,#d16034,#8f3b1e);border-color:rgba(209,96,52,.55)}
.b-rest{background:linear-gradient(160deg,rgba(239,189,77,.24),rgba(239,189,77,.08));border-color:rgba(239,189,77,.42);color:#ffe9b5}
.b-info{background:linear-gradient(160deg,#3d80ba,#295980);border-color:rgba(88,169,238,.5)}
.b-bad{background:linear-gradient(160deg,#e84b3f,#942b23);border-color:rgba(232,75,63,.55)}
.b-acid{background:linear-gradient(160deg,#7fbc35,#4e7b1d);border-color:rgba(163,226,75,.5);color:#f3ffdf}
.b-ghost{background:rgba(255,255,255,.045);color:var(--muted)}
.choices{display:grid;gap:5px}
.choices button{min-height:38px;text-align:left;padding:9px 11px;font-size:12px}
.log{flex:0 0 auto;border-radius:12px;padding:8px 10px;font-size:11px;line-height:1.3;color:var(--muted);background:rgba(21,30,43,.9);
  border:1px solid rgba(255,255,255,.07);border-left:3px solid var(--sand);height:44px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.shop{display:flex;flex-direction:column;gap:6px;padding:10px;flex:1;min-height:0}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;overflow:auto;min-height:0;padding-right:3px;
  scrollbar-width:thin;scrollbar-color:var(--sand2) rgba(255,255,255,.05)}
.shopgrid::-webkit-scrollbar{width:7px}.shopgrid::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:99px}
.shopgrid::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--sand),var(--rust));border-radius:99px}
.shopbtn{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:42px;padding:7px 9px;text-align:left}
.shopbtn .nm{font-size:11px;min-width:0}.shopbtn .nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shopbtn b{font-size:11px;color:var(--sand);white-space:nowrap}
.invrow{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.invrow::-webkit-scrollbar{display:none}
.invrow button{flex:0 0 auto;min-height:34px;padding:6px 9px;font-size:10px}
.sec{font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
.onec{flex:1;min-height:0;padding:10px;display:flex;flex-direction:column}
.win{flex:1;min-height:0;border:2px solid #7a7a7a;border-radius:4px;background:#d4d0c8;color:#111;display:flex;flex-direction:column;box-shadow:inset 1px 1px #fff, inset -1px -1px #808080}
.winbar{height:24px;background:linear-gradient(90deg,#0a246a,#3a6ea5);color:#fff;display:flex;align-items:center;gap:6px;padding:0 6px;font-size:11px;font-weight:700}
.winbar .ico{width:15px;height:15px;background:#f0c040;color:#000;display:grid;place-items:center;font-size:9px;font-weight:900;border-radius:2px}
.winbody{flex:1;min-height:0;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:11px}
.tabs{display:flex;gap:2px}.tabs span{padding:3px 8px;background:#d4d0c8;border:1px solid #808080;border-bottom:0;font-size:10px}
.tabs span.on{background:#ece9d8;font-weight:700}
.form{flex:1;min-height:0;background:#ece9d8;border:1px solid #808080;padding:7px;display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-content:start}
.form label{font-size:10px;color:#222;white-space:nowrap}.form .val{background:#fff;border:1px solid #7f9db9;padding:2px 5px;font-size:10px;min-height:18px}
.wbtns{display:flex;gap:6px;justify-content:flex-end;position:relative;min-height:34px}
.wbtn{min-height:28px;padding:4px 12px;font-size:11px;color:#000;background:#d4d0c8;border:1px solid #808080;border-radius:2px;box-shadow:inset 1px 1px #fff,inset -1px -1px #808080;font-weight:700}
.wbtn:active{box-shadow:inset -1px -1px #fff,inset 1px 1px #808080;transform:none}
.wbtn.run{position:absolute;transition:left .22s ease,top .22s ease}
.timer{height:5px;background:#bfbfbf;border:1px solid #808080}.timer i{display:block;height:100%;background:linear-gradient(90deg,#4fc06d,#eda23a,#e84b3f);transition:width .1s linear}
.menu{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;
  scrollbar-width:thin;scrollbar-color:var(--sand2) rgba(255,255,255,.05)}
.menu::-webkit-scrollbar{width:8px}.menu::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:99px}
.menu::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--sand),var(--rust));border-radius:99px}
.hero{border-radius:20px;padding:16px;border:1px solid var(--line);background:linear-gradient(150deg,rgba(239,189,77,.13),rgba(21,30,43,.95) 48%,rgba(209,96,52,.13))}
.hero h1{margin:0 0 6px;font-size:29px;line-height:1;letter-spacing:-.03em;font-weight:900}.hero h1 span{color:var(--sand)}
.hero p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.rule{border-radius:13px;padding:10px 11px;font-size:12px;line-height:1.4;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.rule b{color:var(--sand);margin-right:7px}
.tro{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.t{border-radius:14px;padding:10px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(160deg,var(--surface2),var(--surface));opacity:.42;filter:grayscale(.8)}
.t.got{opacity:1;filter:none;border-color:rgba(239,189,77,.45)}
.t .e{font-size:22px}.t .n{font-size:11.5px;font-weight:900;margin-top:4px}.t .d{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.rows{display:grid;gap:4px;font-size:12px;color:var(--muted)}.rows div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.08);padding-bottom:3px}.rows b{color:var(--text)}
.badge{display:inline-block;padding:5px 11px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.e-good{background:rgba(79,192,109,.17);color:#c8f3d7;border:1px solid rgba(79,192,109,.5)}
.e-bad{background:rgba(232,75,63,.17);color:#ffb8b1;border:1px solid rgba(232,75,63,.5)}
.e-mid{background:rgba(239,189,77,.17);color:#ffe9b5;border:1px solid rgba(239,189,77,.5)}
.e-sec{background:rgba(196,93,224,.17);color:#ebc8f7;border:1px solid rgba(196,93,224,.5)}
.loader{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.loader .em{font-size:72px}.loader h2{margin:0;font-size:28px;font-weight:900}.loader .ph{font-size:18px;font-weight:900;color:var(--sand);min-height:24px}
.track{width:min(300px,86%);height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--rust),var(--sand));transition:width 1s linear}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
.float{position:absolute;font-weight:900;font-size:16px;text-shadow:0 2px 10px #000;animation:fly 1s ease forwards}
@keyframes fly{0%{opacity:0;transform:translateY(6px) scale(.85)}20%{opacity:1;transform:translateY(-4px) scale(1.1)}100%{opacity:0;transform:translateY(-60px)}}
#toasts{position:fixed;left:0;right:0;top:calc(8px + var(--tg-top));z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 10px}
.toast{width:100%;max-width:420px;display:flex;gap:9px;align-items:center;padding:10px 12px;border-radius:14px;background:linear-gradient(140deg,rgba(239,189,77,.22),rgba(21,30,43,.97));border:1px solid rgba(239,189,77,.5);box-shadow:0 12px 30px rgba(0,0,0,.55);animation:tin .3s ease}
.toast.bad{background:linear-gradient(140deg,rgba(232,75,63,.24),rgba(21,30,43,.97));border-color:rgba(232,75,63,.5)}
.toast.info{background:linear-gradient(140deg,rgba(88,169,238,.22),rgba(21,30,43,.97));border-color:rgba(88,169,238,.5)}
.toast .te{font-size:23px}.toast .tt{font-size:12px;font-weight:900}.toast .td{font-size:10px;color:var(--muted);margin-top:2px}
.toast.out{animation:tout .28s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-16px)}}@keyframes tout{to{opacity:0;transform:translateY(-12px)}}
#burst{position:fixed;inset:0;z-index:45;pointer-events:none}
@media(max-height:700px){
  .pill{min-height:34px;padding:4px 2px}.pill small{font-size:8px}.pill b{font-size:12px}
  .truck{grid-template-columns:66px minmax(0,1fr);padding:9px;gap:8px}.facebox .truckem{font-size:28px}.facebox .driverem{font-size:20px}
  .title{font-size:18px}.desc{-webkit-line-clamp:2;font-size:11px}.quote{font-size:11px;-webkit-line-clamp:1}.doc{display:none}
  button{min-height:40px;padding:7px 5px;font-size:11px}button small{font-size:8px}.log{height:38px;font-size:10.5px}
  .eventtext{-webkit-line-clamp:4;font-size:12px}.eventem{width:44px;height:44px;flex-basis:44px;font-size:25px}.eventtitle{font-size:18px}
}
@media(max-height:600px){.goals{display:none}.strip{min-height:20px}.road{height:18px}.hud{gap:4px}.game{gap:4px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="logo"><i></i>Мираж</div><div class="grow"></div>
    <button class="ic" id="bFs" onclick="fsBtn()">⛶</button>
    <button class="ic" onclick="openTro()">🏆</button>
    <button class="ic" id="bSnd" onclick="sndToggle()">🔊</button>
  </div>
  <div class="main" id="main"><div class="loader"><div class="em">🏗</div><h2>Мираж</h2><div class="ph">Разогреваем весы…</div></div></div>
</div>
<canvas id="burst"></canvas><div id="fx"></div><div id="toasts"></div>
<script>
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;
function syncVP(){
  const h=(tg&&(tg.viewportStableHeight||tg.viewportHeight))||innerHeight;
  document.documentElement.style.setProperty('--app-h',h+'px');
  const sa=(tg&&tg.safeAreaInset)||{top:0,bottom:0},ca=(tg&&tg.contentSafeAreaInset)||{top:0,bottom:0};
  let top=Math.max(sa.top||0,ca.top||0,tg&&tg.isFullscreen?44:0);
  document.documentElement.style.setProperty('--tg-top',top+'px');
  document.documentElement.style.setProperty('--tg-bot',Math.max(sa.bottom||0,ca.bottom||0)+'px');
  const b=document.getElementById('bFs');if(b){const on=!!(tg&&tg.isFullscreen);b.classList.toggle('on',on);b.textContent=on?'⛶✓':'⛶'}
}
function fsBtn(){
  sfx('click');buzz('medium');

function useItem(id){const it=slist().find(x=>x.id===id);if(!it||!has(id))return;if(it.passive){S.shopMsg='Плед уже работает сам. Просто спи.';save();render();return}invAdd(id,-1);sfx('shop');buzz('medium');const e={...it.fx};if(e.drunk>0&&S.food<25)e.drunk+=8;apply(e);if(it.cure&&S.gTimer>0){S.gTimer=-1;S.usedG=true;fx('Уголь победил','#a3e24b')}if(pending())return;const left=leave('Пока ты завтракал, очередь рассосалась сама.');S.shopMsg=it.t+': употреблено.'+(left?' Водитель уехал.':' Водитель ждёт.');S.log=S.shopMsg;tickChains();const due=dueChain();if(due){showEv(due);return}save();render()}
function closeShop(){sfx('click');S.view='hub';S.shopMsg='';if(S.prog>=60){inspect();return}save();render()}
function treat(){if(S.char!=='sasha')return;let used=false;if(has('coffee')){invAdd('coffee',-1);used=true}else if(S.money>=150){S.money-=150;used=true}if(!used){toast('Нечем угостить','☕','bad','Купи кофе или найди 150 ₽.');return}S.treats++;CAR.treats++;apply({vFat:-28,mood:6,loyalty:2});sfx('shop');burst('star',12);fx('🤝 Валера доволен','#4fc06d');S.log='Ты угостил Валеру. Он молча кивнул и пошёл к весам.';checkAch();save();render()}
function sleepTick(){if(S.char!=='sasha')return;sfx('sleep');buzz('medium');S.sleeps++;CAR.sleeps++;const bonus=has('blanket')?12:0;apply({energy:36+bonus,drunk:-14,food:-6,mood:10+(bonus?4:0),vFat:18});let n=3,msg=pick(SLEEP_OK);if(S.vFat>80){n=1;apply({mood:-6,loyalty:-2});msg=pick(SLEEP_BAD)}else loy(3.2);apply({progress:n});tickChains();if(S.sleeps>=5&&S.loy>=62)unlock('sleep5');if(pending())return;const due=dueChain();if(due){S.sleepMsg=msg;showEv(due);return}S.sleepMsg=msg;S.log=msg;S.view='sleepResult';save();render()}
function sleepMore(){sfx('click');S.view='sleep';S.sleepMsg='Саша снова лёг. Валера тяжело вздохнул.';save();render()}
function wake(){sfx('click');S.sleepMsg='';if(S.prog>=60){inspect();return}S.view='hub';nextTruck();save();render()}
function smoke(){if(S.char!=='valera')return;apply({energy:12,mood:9,drunk:-3});const left=leave('Перекур затянулся.');if(pending())return;S.ev={title:'Перекур',emoji:'🚬',text:left?'Вышел на пять минут, вернулся через семь. Водитель уже уехал.':'Вышел на пять минут, вернулся через семь. Но кто тут считает.'};S.view='event';S.log='Перекур. Мир на пять минут стал нормальным.';sfx('ev');tickChains();save();render()}
function choose(i){if(S.view!=='choice'||!S.ev)return;const list=chFor(S.ev),o=list[i];if(!o)return;sfx('click');buzz('medium');const eid=S.ev.id||'',lbl=o.label||'';if(o.need)invAdd(o.need,-1);if(o.use)invAdd(o.use,-1);let g=o.gulya;if(g===undefined&&/gulya/i.test(eid))g=/Съесть|Выпить/i.test(lbl)?1:(/Выбросить|помойку|Закопать|собаке/i.test(lbl)?-1:0);if(g===1){S.gulya++;CAR.gulya++;S.gTimer=4;S.usedG=false;fx('🍲 Гуля…','#e84b3f')}if(g===-1)CAR.trash++;let sl=o.slava;if(sl===undefined&&/slava/i.test(eid)&&/Выпить/i.test(lbl))sl=1;if(sl)CAR.slava++;if(o.bottle===1||/пятилитровк/i.test(lbl)&&/аккуратно/i.test(lbl))unlock('sniper');if(o.bottle===-1||/пятилитровк/i.test(lbl)&&/как получится/i.test(lbl)){unlock('miss');if(!o.chain)queue('c_bucket',3)}if(o.effects)apply(o.effects);if(o.chain)queue(o.chain[0],o.chain[1]);if(o.floor){S.floor=true;CAR.floors++;sfx('poop');burst('poop',18);shake();queue('c_driver',1);queue('c_smell',5);unlock('floor')}if(o.clean)S.floor=false;if(o.never)unlock('never_again');let extra='';if(o.gamble){const win=maybe(o.gamble.c);apply(win?o.gamble.s:o.gamble.f);extra=' '+(win?o.gamble.w:o.gamble.l);if(win){sfx('coin');burst('coin',10)}else{sfx('bad');shake()}}checkAch();if(pending())return;if(o.next){const nx=findEv(o.next);if(nx){showEv(nx);return}}const insp=S.ev.inspection;S.ev={title:o.rT||o.resultTitle||'Итог',emoji:o.rE||o.resultEmoji||'✅',text:txt(o.rX||o.resultText||lbl)+extra,endAfter:!!insp};S.view='event';S.log=S.ev.text;save();render()}
function cont(){sfx('click');buzz('light');if(S.ev&&S.ev.endAfter){finish();return}S.ev=null;if(S.prog>=60){inspect();return}const due=dueChain();if(due){showEv(due);return}S.view='hub';nextTruck();save();render()}

let miniT=0,miniM=0;
function stopMini(){if(miniT){clearInterval(miniT);miniT=0}if(miniM){clearInterval(miniM);miniM=0}}
function startMini(kind){stopMini();S.mini={kind,step:0,left:7200,x:58,y:18};S.view='mini';S.log='1С открыла форму. Нажми «Вес», потом «Выполнить».';sfx('mini');buzz('medium');save();render();miniT=setInterval(()=>{if(!S.mini){stopMini();return}S.mini.left-=100;const el=document.getElementById('mtimer');if(el)el.style.width=Math.max(0,S.mini.left/7200*100)+'%';if(S.mini.left<=0)endMini(false)},100);if(S.drunk>=50)miniM=setInterval(()=>{if(!S.mini||S.mini.step<1)return;S.mini.x=38+Math.random()*34;S.mini.y=8+Math.random()*26;const b=document.getElementById('mrun');if(b){b.style.left=S.mini.x+'%';b.style.top=S.mini.y+'%'}},700)}
function miniTap(step){if(!S.mini||step!==S.mini.step)return;sfx('mini');buzz('light');if(step===0){S.mini.step=1;const a=document.getElementById('mweight');if(a){a.disabled=true;a.style.opacity='.5'}const b=document.getElementById('mrun');if(b){b.style.display='block';b.style.left=S.mini.x+'%';b.style.top=S.mini.y+'%'}const h=document.getElementById('mhint');if(h)h.textContent='Теперь «Выполнить». Не промахнись.'}else endMini(true)}
function endMini(ok){stopMini();const kind=S.mini?S.mini.kind:'work';S.mini=null;S.view='hub';if(ok){CAR.miniW++;fx('1С проведена','#a3e24b');unlock('mini_win');resolveWork(kind,true)}else{CAR.miniF++;unlock('mini_fail');sfx('fail');doMiss()}}

Валеру подуть',effects:{vFat:20,loyalty:7,mood:-7},rT:'Командная работа',rX:'Валера подул. Начальство записало его фамилию. Твою — нет.',rE:'🧑‍🔧'}:{label:'🍺 «Это квас»',effects:{loyalty:-8,mood:-4},rT:'Квас',rX:'Квас такого градуса не бывает.',rE:'🍺'}]}}else if(S.loy<45){e={id:'i_raz',inspection:true,title:'Разнос',emoji:'🤬',text:'Начальник участка приехал лично. Стоит в дверях будки и молчит ровно столько, чтобы стало страшно.',choices:[{label:'🙇 Извиниться и показать журнал',effects:{loyalty:16,mood:-12},rT:'Признание',rX:'Полистал журнал, буркнул и уехал. Это почти победа.',rE:'🙇'},{label:'💻 «Это всё 1С»',gamble:{c:.5,s:{loyalty:9,mood:2},f:{loyalty:-8,mood:-8},w:'Он тоже ненавидит 1С. Вы почти подружились.',l:'Он позвонил айтишникам. Те подтвердили, что всё работает.'},rT:'Классика',rX:'Универсальная отмазка объекта «Мираж».',rE:'💻'},{label:'🤐 Молчать',effects:{loyalty:-5,mood:-5},rT:'Тишина',rX:'Молчание засчитали как признание.',rE:'🤐'}]}}else{e={id:'i_rep',inspection:true,title:'Отчёт за смену',emoji:'📊',text:'Шестьдесят машин позади. Начальство просит итоговый отчёт и «пару слов о работе поста».',choices:[{label:'📋 Сдать как есть',effects:{loyalty:10,mood:-3},rT:'Честный отчёт',rX:'Цифры сошлись. Начальство удивилось и даже кивнуло.',rE:'📋'},S.char==='sasha'?{label:'✨ Добавить «оптимизация»',effects:{loyalty:13,mood:8},rT:'Оптимизация',rX:'Слово сделало всю работу за тебя.',rE:'✨'}:{label:'✨ Добавить «оптимизация»',gamble:{c:.4,s:{loyalty:9,mood:6},f:{loyalty:-7,mood:-7},w:'В этот раз формулировка зашла.',l:'Начальство попросило показать, где именно оптимизация.'},rT:'Оптимизация',rX:'Ты добавил красивых слов в отчёт.',rE:'✨'},{label:'🚬 Подписать и уйти',effects:{mood:6,loyalty:-1},rT:'Смена сдана',rX:'Подпись, дверь, вагончик. Отчёт подождёт до утра.',rE:'🚬'}]}}S.ev=e;S.log=e.text;sfx('boss');buzzN('warning');shake();save();render()}
function gDone(){return S.goals.filter(id=>{const g=GOALS.find(x=>x.id===id);return g&&g.f(S)}).length}
function finish(){stopMini();const done=gDone(),bonus=done*1800;S.money+=bonus;S.endBonus=bonus;CAR.shifts++;CAR.wShift++;CAR.wMoney+=S.money;CAR.best=Math.max(CAR.best,S.money);unlock('marathon');if(done===3&&S.mistakes===0)unlock('perfect');if(!S.everDrunk)unlock('dry');if(S.bribes===0)unlock('conscience');let weekEnd=false;if(CAR.wShift>=7){weekEnd=true;CAR.weeks++;if(CAR.wMoney>=80000)unlock('bank')}let kind='mid',text='';const dead=S.loy<=0||S.mistakes>=9||S.theft>=230;if(S.char==='sasha'){if(dead){kind='bad';text='Начальство приехало лично, склад плачет, песок исчез. Саша первым написал заявление — говорит, сам захотел.'}else if(S.sleeps>=5&&S.loy>=62){kind='sec';text='СЕКРЕТНАЯ: «Спящий гений». Он проспал половину вахты, но по отчётам — лучший весовщик объекта. Никто так и не понял, как.'}else if(done>=2&&S.money>=14000){kind='good';text='Задачи закрыты, деньги есть, Валера устал, начальство довольно. Классический Саша.'}else{kind='mid';text='Никто не понял, что он делал, но смена закрыта и кошелёк не пустой.'}}else{if(dead){kind='bad';text='Начальник участка орал так, что весы обнулились. Валера ушёл в закат, захватив кружку и достоинство.'}else if(S.loy>=68&&S.mistakes<=2&&S.theft<=20){kind='good';text='Взвесил всё, починил всё, никого не подставил. Единственный человек на объекте, которому можно доверять.'}else if(S.bribes>=6&&S.money>=18000){kind='sec';text='СЕКРЕТНАЯ: «Тихий омут». Валера всю жизнь был правильным, а потом просто перестал. И оказался в этом подозрительно хорош.'}else{kind='mid';text='Спина болит, 1С висит, премия «в следующем месяце». Но смену он снова вытащил.'}}if(weekEnd){text+=' ВАХТА ЗАКРЫТА: '+CAR.wShift+' смен, '+Math.round(CAR.wMoney)+' ₽ в копилке'+(CAR.wMoney>=80000?'. Цель взята!':'. Цель не взята, но ты жив.');CAR.wShift=0;CAR.wMoney=0}S.endKind=kind;S.endText=text;S.screen='end';sfx(kind==='bad'?'boss':'win');buzzN(kind==='bad'?'error':'success');if(kind!=='bad')burst('star',24);checkAch();save();render()}
function shareResult(){const t='ОБЪЕКТ «МИРАЖ»\nВесовщик: '+(ch()?ch().name:'—')+'\nМашины: '+S.prog+'/60\nДеньги: '+Math.round(S.money)+' ₽\nНалево: '+Math.round(S.theft)+' т\nОпьянение: '+Math.round(S.drunk)+'%\nКосяки: '+S.mistakes+'\nЗадачи: '+gDone()+'/3\n\n'+(S.endText||'');const url='https://t.me/share/url?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(t);try{if(tg&&tg.openTelegramLink){tg.openTelegramLink(url);return}}catch(e){}if(navigator.share){navigator.share({title:'Весовщики: Мираж',text:t}).catch(()=>{});return}if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast('Результат скопирован','📋','info','Вставь в чат и хвастайся.'));return}toast('Не удалось поделиться','📋','bad','Скопируй результат вручную.')}

function bar(v){return'<i style="width:'+cl(v,0,100)+'%;background:currentColor;opacity:.45"></i>'}
function stats(){const p=S.char==='sasha'?'<div class="pill p-pat"><small>🧑‍🔧 Терпение</small><b>'+Math.round(pat())+'%</b>'+bar(pat())+'</div>':'<div class="pill p-pat"><small>🛻 Машины</small><b>'+S.prog+'/60</b>'+bar(S.prog/60*100)+'</div>';return'<div class="hud"><div class="pill p-money"><small>💰 Деньги</small><b>'+Math.round(S.money)+'</b></div><div class="pill p-loy"><small>📈 Лояльность</small><b>'+Math.round(S.loy)+'%</b>'+bar(S.loy)+'</div><div class="pill p-mood"><small>😐 Настроение</small><b>'+Math.round(S.mood)+'%</b>'+bar(S.mood)+'</div><div class="pill p-theft"><small>🚚 Воровство</small><b>'+Math.round(S.theft)+' т</b></div><div class="pill p-drunk"><small>🍺 Опьянение</small><b>'+Math.round(S.drunk)+'%</b>'+bar(S.drunk)+'</div><div class="pill p-energy"><small>⚡ Бодрость</small><b>'+Math.round(S.energy)+'%</b>'+bar(S.energy)+'</div><div class="pill p-food"><small>🍽 Сытость</small><b>'+Math.round(S.food)+'%</b>'+bar(S.food)+'</div>'+p+'</div>'}
function goalsUI(){return'<div class="goals">'+S.goals.map(id=>{const g=GOALS.find(x=>x.id===id);if(!g)return'';const ok=g.f(S);return'<div class="goal'+(ok?' done':'')+'">'+(ok?'✓ ':'○ ')+g.t+'</div>'}).join('')+'</div>'}
function road(){const p=S.prog/60*100;return'<div class="road"><i style="width:'+p+'%"></i><b style="left:'+cl(p,3,97)+'%">🚚</b><u>'+pname()+' • '+S.prog+'/60</u></div>'}
function truckCard(){const t=truck();if(!t)return'<div class="card"><div class="eventcard"><div class="eventhead"><div class="eventem">🌫</div><div><div class="eventtag">Объект «Мираж»</div><div class="eventtitle">Тишина на весах</div></div></div><div class="eventtext">Пока никто не едет. Подозрительно.</div></div></div>';const chips=['<span class="chip info">'+t.cargo+' • '+t.weight+' т</span>',t.plate?'<span class="chip">'+t.plate+'</span>':'',t.inBase?'<span class="chip ok">номер в базе</span>':'<span class="chip warn">новый номер</span>',t.patience===1?'<span class="chip bad">торопится</span>':(t.patience===3?'<span class="chip ok">подождёт</span>':''),S.offer?'<span class="chip warn">мутит • '+Math.round(S.offer/2)+' ₽</span>':'<span class="chip">не мутит</span>',S.floor?'<span class="chip bad">пол грязный</span>':'',S.gTimer>0?'<span class="chip warn">живот крутит</span>':''].filter(Boolean).join('');return'<div class="card"><div class="truck"><div class="facebox"><div class="truckem">'+t.emoji+'</div><div class="driverem">'+t.driverEmoji+'</div></div><div class="info"><div class="kicker">'+t.brand+(t.model?' '+t.model:'')+'</div><div class="title">'+t.driver+' <em>за рулём</em></div><div class="chips">'+chips+'</div><div class="desc">'+(t.driverDesc||t.text)+'</div>'+(t.quote?'<div class="quote">«'+t.quote+'»</div>':'')+'<div class="doc">📄 '+S.doc+'</div></div></div></div>'}
function evCard(){const e=S.ev;if(!e)return truckCard();return'<div class="card"><div class="eventcard"><div class="eventhead"><div class="eventem">'+(e.emoji||'🎲')+'</div><div><div class="eventtag">'+(e.inspection?'Финальная проверка':(e.trigger==='chain'?'Последствия':'Событие'))+'</div><div class="eventtitle">'+(e.title||'Что-то случилось')+'</div></div></div><div class="eventtext">'+txt(e.text)+'</div></div></div>'}
function simple(em,sub,title,text){return'<div class="card"><div class="eventcard"><div class="eventhead"><div class="eventem">'+em+'</div><div><div class="eventtag">'+sub+'</div><div class="eventtitle">'+title+'</div></div></div><div class="eventtext">'+text+'</div></div></div>'}
function miniCard(){const m=S.mini||{step:0,left:7200,x:58,y:18};return'<div class="card"><div class="onec"><div class="win"><div class="winbar"><span class="ico">1С</span>Весовая: Мираж — Документ взвешивания</div><div class="winbody"><div class="tabs"><span class="on">Основное</span><span>Дополнительно</span><span>Печать</span></div><div class="form"><label>Автомобиль:</label><div class="val">'+(truck()?truck().brand:'—')+'</div><label>Водитель:</label><div class="val">'+(truck()?truck().driver:'—')+'</div><label>Груз:</label><div class="val">'+(truck()?truck().cargo+' • '+truck().weight+' т':'—')+'</div><label id="mhint">'+(m.step===0?'Нажми «Вес», чтобы зафиксировать массу.':'Теперь «Выполнить». Не промахнись.')+'</label><div class="val">'+(m.step===0?'ожидание взвешивания':'вес зафиксирован')+'</div></div><div class="wbtns"><button class="wbtn" id="mweight" onclick="miniTap(0)"'+(m.step>0?' disabled':'')+'>⚖️ Вес</button><button class="wbtn run" id="mrun" style="display:'+(m.step>0?'block':'none')+';left:'+m.x+'%;top:'+m.y+'%" onclick="miniTap(1)">✅ Выполнить</button></div><div class="timer"><i id="mtimer" style="width:'+(m.left/7200*100)+'%"></i></div></div></div></div></div>'}
function current(){if(S.view==='hub')return truckCard();if(S.view==='mini')return miniCard();if(S.view==='choice'||S.view==='event')return evCard();if(S.view==='shop')return shopCard();if(S.view==='sleep')return simple('😴','Вагончик','Сон',S.sleepMsg||'Саша лёг спать.');if(S.view==='sleepResult')return simple('🛏','Вагончик','Пока Саша спал',S.sleepMsg||'');return truckCard()}
function shopCard(){const inv=Object.keys(S.inv).filter(k=>S.inv[k]>0);return'<div class="card"><div class="shop"><div class="eventhead"><div class="eventem">🎒</div><div><div class="eventtag">Ларёк у охраны</div><div class="eventtitle">Заначка</div></div></div><div class="shopgrid">'+slist().map(it=>'<button class="shopbtn" onclick="buy(\''+it.id+'\')"'+(S.money<it.p?' disabled':'')+'><span class="nm"><span>'+it.e+' '+it.t+(has(it.id)?' ×'+S.inv[it.id]:'')+'</span></span><b>'+it.p+' ₽</b></button>').join('')+'</div><div class="sec">Использовать сейчас</div>'+(inv.length?'<div class="invrow">'+inv.map(k=>{const it=slist().find(x=>x.id===k)||{e:'📦',t:k};return'<button class="b-acid" onclick="useItem(\''+k+'\')"'+(it.passive?' disabled':'')+'>'+it.e+' '+it.t+' ×'+S.inv[k]+'</button>'}).join('')+'</div>':'<div class="rule" style="padding:7px 9px;font-size:11px">Заначка пуста. На проверке будет обидно.</div>')+'</div></div>'}
function actionsUI(){const c=ch();if(S.view==='hub'){let top='';if(isZhab())top='<button class="b-bad" onclick="spit()">💦 Плюнуть в Жабинского<small>Он уедет недовольный. Очередь зауважает.</small></button>';return top+'<div class="grid">'+c.acts.map(a=>{const dis=(a==='bribe'&&!S.offer)||(a==='treat'&&!has('coffee')&&S.money<150);const sub=a==='bribe'?(S.offer?'+'+Math.round(S.offer/2)+' ₽ • '+((truck()||{}).weight||0)+' т':'не мутит'):a==='work'?'+200 ₽ • лояльность ↑':a==='sleep'?'Валера прикроет'+(has('blanket')?' • плед':''):a==='shop'?(Object.keys(S.inv).length?'заначка: '+Object.keys(S.inv).length:'еда, пиво, уголь'):a==='treat'?(has('coffee')?'кофе из заначки':'150 ₽ • терпение ↑'):'снять напряжение';return'<button class="'+ACT[a].c+'"'+(dis?' disabled':'')+' onclick="hub(\''+a+'\')">'+ACT[a].l+'<small>'+sub+'</small></button>'}).join('')+'</div>'}if(S.view==='mini')return'<button class="b-ghost" onclick="endMini(false)">Сдаться 1С</button>';if(S.view==='choice')return'<div class="choices">'+chFor(S.ev).map((o,i)=>'<button class="'+(S.ev.inspection?'b-info':'')+'" onclick="choose('+i+')">'+o.label+(o.need?'<small>из заначки</small>':'')+'</button>').join('')+'</div>';if(S.view==='event')return'<button class="b-work" onclick="cont()">'+(S.ev&&S.ev.endAfter?'Завершить смену':'Дальше')+'</button>';if(S.view==='shop')return'<button class="b-ghost" onclick="closeShop()">Назад к весам</button>';if(S.view==='sleep')return'<div class="grid two"><button class="b-rest" onclick="sleepTick()">😴 Спать<small>+бодрость, Валера взвесит</small></button><button class="b-ghost" onclick="wake()">Проснуться</button></div>';if(S.view==='sleepResult')return'<div class="grid two"><button class="b-rest" onclick="sleepMore()">Спать дальше</button><button class="b-work" onclick="wake()">Пойти работать</button></div>';return''}
function gameUI(){const c=ch();if(!c)return startUI();return'<div class="game"><div class="strip"><div class="mod">'+c.emoji+' '+c.name+(S.daily?' • день':'')+'</div>'+road()+'<div class="mod">'+(S.mod?S.mod.e+' '+S.mod.n:'☀️ День')+'</div></div>'+stats()+goalsUI()+'<div class="stage">'+current()+'</div><div class="controls">'+actionsUI()+'</div><div class="log">'+S.log+'</div></div>'}
function startUI(){const rs=shuf(rpool()).slice(0,3),got=Object.keys(CAR.ach).length;return'<div class="menu"><div class="hero"><h1>Весовщики:<br><span>Мираж</span></h1><p>Вахта, 1С, шестьдесят самосвалов за смену. Песок налево, обед от Гули, дядя Слава с бутылкой и начальник участка, который приезжает в самый неподходящий момент.</p></div><div class="rule"><b>Вахта</b>Смена '+Math.min(CAR.wShift+1,7)+' из 7 · копилка '+Math.round(CAR.wMoney)+' / 80 000 ₽ · трофеи '+got+'/'+ACH.length+'</div><div class="grid two">'+CHARS.map(c=>'<button class="'+(c.id==='sasha'?'b-rest':'b-work')+'" onclick="newShift(\''+c.id+'\')">'+c.emoji+' '+c.name+'<small>'+c.d1+'<br>'+c.d2+'</small></button>').join('')+'</div><div class="grid two"><button class="'+(S.daily?'b-acid':'b-ghost')+'" onclick="toggleDaily()">'+(S.daily?'✓ ':'')+'🗓 Смена дня</button><button class="b-info" onclick="openTro()">🏆 Трофеи '+got+'/'+ACH.length+'</button></div><div class="grid two"><button class="b-ghost" onclick="openRules()">📖 Правила</button><button class="b-ghost" onclick="fsBtn()">⛶ Во весь экран</button></div>'+rs.map(r=>'<div class="rule">'+r+'</div>').join('')+'</div>'}
function rulesUI(){return'<div class="menu"><div class="hero"><h1 style="font-size:27px">Правила <span>объекта</span></h1><p>Всё, что нужно знать, прежде чем нажать «Выполнить».</p></div>'+rpool().map((r,i)=>'<div class="rule"><b>'+String(i+1).padStart(2,'0')+'</b>'+r+'</div>').join('')+'<button class="b-work" onclick="toStart()">Понятно</button></div>'}
function troUI(){const got=Object.keys(CAR.ach).length;return'<div class="menu"><div class="hero"><h1 style="font-size:27px">Трофеи <span>Миража</span></h1><p>Открыто '+got+' из '+ACH.length+'. Достижения сохраняются между сменами.</p></div><div class="tro">'+ACH.map(a=>'<div class="t'+(CAR.ach[a.id]?' got':'')+'"><div class="e">'+(CAR.ach[a.id]?a.e:'🔒')+'</div><div class="n">'+a.n+'</div><div class="d">'+a.d+'</div></div>').join('')+'</div><button class="b-work" onclick="toStart()">Назад</button></div>'}
function endUI(){const done=gDone(),cls={good:'e-good',bad:'e-bad',mid:'e-mid',sec:'e-sec'}[S.endKind||'mid'],lbl={good:'Смена вытянута',bad:'Провал',mid:'Смена закрыта',sec:'Секретная концовка'}[S.endKind||'mid'];const share='ОБЪЕКТ «МИРАЖ»\nВесовщик: '+(ch()?ch().name:'—')+'\nМашины: '+S.prog+'/60\nДеньги: '+Math.round(S.money)+' ₽\nНалево: '+Math.round(S.theft)+' т\nОпьянение: '+Math.round(S.drunk)+'%\nЗадачи: '+done+'/3';return'<div class="menu"><div class="hero"><span class="badge '+cls+'">'+lbl+'</span><h1 style="margin-top:10px;font-size:28px">Смена окончена</h1><p>'+S.endText+'</p></div><div class="rule"><div class="rows"><div><span>Машины</span><b>'+S.prog+'/60</b></div><div><span>Деньги</span><b>'+Math.round(S.money)+' ₽</b></div><div><span>Бонус за задачи ('+done+'/3)</span><b>+'+S.endBonus+' ₽</b></div><div><span>Лояльность</span><b>'+Math.round(S.loy)+'%</b></div><div><span>Воровство</span><b>'+Math.round(S.theft)+' т</b></div><div><span>Честных / муток</span><b>'+S.honest+' / '+S.bribes+'</b></div><div><span>Косяки</span><b>'+S.mistakes+'</b></div><div><span>Обеды Гули</span><b>'+S.gulya+'</b></div><div><span>Копилка вахты</span><b>'+Math.round(CAR.wMoney)+' / 80 000 ₽</b></div></div></div><div class="goals">'+S.goals.map(id=>{const g=GOALS.find(x=>x.id===id);if(!g)return'';const ok=g.f(S);return'<div class="goal'+(ok?' done':'')+'">'+(ok?'✓ ':'✕ ')+g.t+'</div>'}).join('')+'</div><div class="rule" style="font-family:ui-monospace,monospace;white-space:pre-wrap">'+share+'</div><div class="grid two"><button class="b-work" onclick="newShift(\''+S.char+'\')">Ещё смена</button><button class="b-info" onclick="shareResult()">📤 Поделиться</button></div><div class="grid two"><button class="b-ghost" onclick="openTro()">🏆 Трофеи</button><button class="b-ghost" onclick="toStart()">Сменить весовщика</button></div></div>'}
const PH=[{t:'Ищу песок',e:'🔍'},{t:'Нахожу песок',e:'🏜'},{t:'Жую песок',e:'🥪'},{t:'Типичная вахта',e:'🌙'}];
function loadUI(){const p=PH[Math.min(S.phase,PH.length-1)],w=Math.min(100,(S.phase+1)/PH.length*100);return'<div class="loader"><div class="em">'+p.e+'</div><h2>Объект «Мираж»</h2><div class="ph">'+p.t+'</div><div class="track"><i style="width:'+w+'%"></i></div><div style="font-size:11px;color:var(--muted)">Разогреваем весы и запускаем 1С…</div></div>'}
function render(){const m=document.getElementById('main');if(!m)return;if(S.screen==='game'&&!ch())S.screen='start';let h='';if(S.screen==='loading')h=loadUI();else if(S.screen==='start')h=startUI();else if(S.screen==='rules')h=rulesUI();else if(S.screen==='tro')h=troUI();else if(S.screen==='end')h=endUI();else h=gameUI();m.innerHTML=h;paintTop();syncVP();if(S.view==='mini'&&S.mini){const b=document.getElementById('mrun');if(b&&S.mini.step>0){b.style.display='block';b.style.left=S.mini.x+'%';b.style.top=S.mini.y+'%'}}}
function ls(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function uniq(a){const s={};return(a||[]).filter(x=>{const k=x&&x.id?x.id:JSON.stringify(x);if(s[k])return false;s[k]=1;return true})}
async function boot(){const jobs=[];for(let i=1;i<=MAXF;i++)['cards','events','shop','rules'].forEach(p=>jobs.push(ls(p+'-'+i+'.js').catch(()=>{})));await Promise.all(jobs);window.TRUCKS=uniq(window.TRUCKS);window.EVENTS=uniq(window.EVENTS);window.SHOP=uniq(window.SHOP);window.RULES=uniq(window.RULES);loadAll();paintTop();syncVP();S.screen='loading';S.phase=0;render();const iv=setInterval(()=>{S.phase++;sfx('tick');if(S.phase>=PH.length){clearInterval(iv);S.screen='start';save();render()}else render()},1000)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(BRAF){cancelAnimationFrame(BRAF);BRAF=0}BP=[];BX.clearRect(0,0,BC.width,BC.height);stopMini()}else{syncVP();render()}});
boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#07090e" />
<title>Весовщики: Мираж</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --night:#07090e; --asphalt:#0d1219; --panel:#141c26; --panel2:#1c2734; --overlay:#25313f; --scrim:rgba(4,6,10,.78);
  --sand:#f0bd4a; --sand2:#c98f22; --rust:#d05f31; --diesel:#3f8b9c; --acid:#9fe04a;
  --ok:#4fc06d; --warn:#eda23a; --bad:#e8483c; --info:#57a8ee; --weird:#c061e0;
  --text:#f6f1e4; --muted:#8b98aa; --line:rgba(240,189,74,.18);
  --app-h:100dvh; --tg-top:0px; --tg-bot:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--night)}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);touch-action:manipulation}
#sky{position:fixed;inset:0;z-index:0;background:
  radial-gradient(120% 78% at 10% -12%, rgba(240,189,74,.20), transparent 58%),
  radial-gradient(95% 62% at 92% 2%, rgba(63,139,156,.22), transparent 60%),
  radial-gradient(85% 65% at 50% 112%, rgba(208,95,49,.18), transparent 62%),
  linear-gradient(180deg,#07090e,#0a0f16 55%,#07090e)}
#aurora{position:fixed;inset:-25%;z-index:0;pointer-events:none;opacity:.5;filter:blur(46px);
  background:conic-gradient(from 0deg at 50% 50%, rgba(240,189,74,.16), rgba(63,139,156,.14), rgba(192,97,224,.10), rgba(208,95,49,.14), rgba(240,189,74,.16));
  animation:spin 44s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#dust,#burst{position:fixed;inset:0;pointer-events:none}
#dust{z-index:1;opacity:.6}#burst{z-index:60}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.scan{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.16;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px)}
#flash{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;transition:opacity .1s}

.app{position:relative;z-index:5;width:100%;max-width:580px;margin:0 auto;height:100vh;height:100dvh;height:var(--app-h);
  display:flex;flex-direction:column;overflow:hidden;padding:calc(10px + var(--tg-top)) 10px calc(10px + var(--tg-bot))}
.app.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-8px,2px)}40%,60%{transform:translate(8px,-1px)}}

.topbar{display:flex;align-items:center;gap:7px;flex-shrink:0;padding-bottom:9px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.15em;font-size:10.5px;text-transform:uppercase;color:var(--sand);
  background:linear-gradient(135deg,rgba(240,189,74,.18),rgba(208,95,49,.10));border:1px solid var(--line);border-radius:999px;padding:8px 13px;white-space:nowrap}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--sand);box-shadow:0 0 12px var(--sand);animation:pulse 2.6s infinite}
@keyframes pulse{0%,86%,100%{opacity:1;transform:scale(1)}90%{opacity:.25;transform:scale(.7)}}
.grow{flex:1}
.ib{height:38px;min-width:38px;padding:0 11px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(160deg,var(--panel2),var(--panel));color:var(--text);font-size:15px;font-weight:800;cursor:pointer;transition:.16s}
.ib:active{transform:scale(.9)}
.ib.off{color:var(--muted);opacity:.65}
.ib.on{color:var(--acid);border-color:rgba(159,224,74,.45);box-shadow:0 0 16px rgba(159,224,74,.18)}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding-right:5px;
  scrollbar-width:thin;scrollbar-color:var(--sand2) rgba(255,255,255,.05)}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:99px}
.scroll::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--sand),var(--rust));border-radius:99px;border:2px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ffd873,var(--rust));background-clip:padding-box}

.hero{position:relative;overflow:hidden;border-radius:26px;padding:19px;border:1px solid var(--line);
  background:linear-gradient(150deg,rgba(240,189,74,.13),rgba(20,28,38,.94) 46%,rgba(208,95,49,.14));
  box-shadow:0 22px 50px rgba(0,0,0,.55);animation:rise .5s cubic-bezier(.2,.9,.25,1)}
.hero:before{content:"";position:absolute;top:-60%;right:-18%;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,189,74,.26),transparent 66%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.16);opacity:1}}
.hero h1{position:relative;margin:0 0 7px;font-size:33px;line-height:.98;letter-spacing:-.035em;font-weight:900}
.hero h1 span{color:var(--sand);text-shadow:0 0 26px rgba(240,189,74,.35)}
.hero p{position:relative;margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
@keyframes rise{0%{opacity:0;transform:translateY(22px)}100%{opacity:1;transform:none}}

.road{position:relative;height:26px;border-radius:99px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.07);overflow:hidden;flex-shrink:0}
.road i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(208,95,49,.5),rgba(240,189,74,.55));transition:width .55s cubic-bezier(.2,.9,.25,1)}
.road b{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:15px;transition:left .55s cubic-bezier(.2,.9,.25,1);filter:drop-shadow(0 2px 5px #000)}
.road u{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px #000}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex-shrink:0}
.stat{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:7px 5px;text-align:center}
.stat small{display:block;font-size:9px;font-weight:800;color:var(--muted);margin-bottom:3px;white-space:nowrap;letter-spacing:.01em}
.stat b{font-size:15px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.stat .bar{position:absolute;left:0;bottom:0;height:3px;transition:width .5s cubic-bezier(.2,.9,.25,1)}
.stat.hit{animation:hit .55s ease}
@keyframes hit{0%{box-shadow:0 0 0 0 rgba(240,189,74,.55);transform:scale(1)}30%{transform:scale(1.06)}100%{box-shadow:0 0 0 14px rgba(240,189,74,0);transform:scale(1)}}
.s-money b{color:var(--sand)}.s-loy b{color:var(--info)}.s-mood b{color:var(--weird)}.s-theft b{color:var(--rust)}
.s-drunk b{color:var(--warn)}.s-energy b{color:var(--ok)}.s-food b{color:#dda36d}.s-pat b{color:var(--diesel)}

.goals{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.goal{font-size:10px;font-weight:800;padding:6px 10px;border-radius:999px;border:1px dashed rgba(255,255,255,.17);color:var(--muted);background:rgba(255,255,255,.03);transition:.3s}
.goal.done{border-style:solid;border-color:rgba(79,192,109,.55);color:#c6f2d5;background:rgba(79,192,109,.14);box-shadow:0 0 14px rgba(79,192,109,.14)}
.mod{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:15px;flex-shrink:0;
  background:linear-gradient(120deg,rgba(63,139,156,.18),rgba(20,28,38,.7));border:1px solid rgba(63,139,156,.3);font-size:12px;color:#bfe4ec}
.mod b{color:#fff;font-size:12.5px}

.card{position:relative;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.1);flex-shrink:0;
  background:linear-gradient(165deg,rgba(255,255,255,.07),rgba(20,28,38,.97));box-shadow:0 24px 54px rgba(0,0,0,.58);
  animation:cardIn .46s cubic-bezier(.16,1,.3,1);transform-origin:50% 100%}
@keyframes cardIn{0%{opacity:0;transform:perspective(900px) translateY(30px) rotateX(9deg) scale(.94)}60%{opacity:1}100%{opacity:1;transform:perspective(900px) none}}
.card-art{position:relative;height:136px;display:grid;place-items:center;font-size:68px;overflow:hidden;
  background:radial-gradient(circle at 22% 24%,rgba(240,189,74,.24),transparent 56%),radial-gradient(circle at 80% 82%,rgba(63,139,156,.24),transparent 56%),var(--panel2)}
.card-art .em{position:relative;z-index:2;animation:arrive .6s cubic-bezier(.16,1,.3,1);filter:drop-shadow(0 8px 16px rgba(0,0,0,.6))}
@keyframes arrive{0%{transform:translateX(-70px) scale(.7);opacity:0}70%{transform:translateX(6px) scale(1.05)}100%{transform:none;opacity:1}}
.card-art:after{content:"";position:absolute;inset:auto 0 0 0;height:40px;background:linear-gradient(transparent,rgba(7,9,14,.9));z-index:3}
.beam{position:absolute;top:-40px;left:-30%;width:52%;height:210px;transform:rotate(17deg);z-index:1;
  background:linear-gradient(90deg,transparent,rgba(240,189,74,.16),transparent);animation:beam 5.5s linear infinite}
@keyframes beam{0%{left:-45%}100%{left:115%}}
.card-body{padding:14px 15px 16px;display:grid;gap:9px}
.card-sub{font-size:10px;color:var(--sand);font-weight:900;letter-spacing:.16em;text-transform:uppercase}
.card-title{font-size:25px;font-weight:900;letter-spacing:-.025em;line-height:1.04}
.card-title em{font-style:normal;color:var(--muted);font-size:16px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10px;font-weight:800;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted);border:1px solid rgba(255,255,255,.07)}
.chip.warn{color:#ffdb9f;border-color:rgba(237,162,58,.45);background:rgba(237,162,58,.14)}
.chip.bad{color:#ffb7b0;border-color:rgba(232,72,60,.45);background:rgba(232,72,60,.14)}
.chip.ok{color:#c6f2d5;border-color:rgba(79,192,109,.45);background:rgba(79,192,109,.14)}
.chip.info{color:#c2e0fa;border-color:rgba(87,168,238,.45);background:rgba(87,168,238,.14)}
.chip.weird{color:#e9c6f7;border-color:rgba(192,97,224,.45);background:rgba(192,97,224,.14)}
.driver{display:flex;gap:11px;align-items:flex-start;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:11px 12px}
.driver .face{font-size:27px;line-height:1;animation:idle 3.4s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}
.driver .who{font-size:13px;font-weight:900}
.driver .desc{font-size:12px;color:var(--muted);line-height:1.4;margin-top:3px}
.quote{font-size:13px;color:var(--sand);font-weight:700;line-height:1.4;border-left:3px solid var(--rust);padding-left:11px}
.card-text{font-size:13px;color:var(--muted);line-height:1.45}
.doc{font-size:11px;color:#9fb0c4;background:rgba(87,168,238,.08);border:1px dashed rgba(87,168,238,.3);border-radius:11px;padding:8px 10px;font-family:ui-monospace,monospace}
.stamp{position:absolute;top:52px;right:14px;z-index:6;font-size:15px;font-weight:900;letter-spacing:.1em;padding:8px 14px;border-radius:8px;
  border:3px solid currentColor;transform:rotate(-13deg);animation:stamp .75s cubic-bezier(.2,1.5,.4,1) forwards;pointer-events:none;text-transform:uppercase}
@keyframes stamp{0%{opacity:0;transform:rotate(-13deg) scale(2.6)}40%{opacity:1;transform:rotate(-13deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:rotate(-13deg) scale(1.05)}}

.actions{display:grid;gap:7px;flex-shrink:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{position:relative;overflow:hidden;font-family:inherit;border:1px solid rgba(255,255,255,.09);border-radius:15px;padding:13px 12px;font-size:14px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(160deg,var(--overlay),var(--panel2));transition:transform .1s cubic-bezier(.2,1.4,.4,1),filter .18s,box-shadow .18s}
button:active{transform:scale(.955)}
button:disabled{opacity:.4;filter:grayscale(.7);cursor:not-allowed}
button small{display:block;font-size:10px;font-weight:700;opacity:.82;margin-top:3px;line-height:1.25}
button:after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;transform:skewX(-22deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transition:left .55s}
button:active:after{left:130%}
.b-work{background:linear-gradient(160deg,#43a862,#2a7448);border-color:rgba(79,192,109,.55);box-shadow:0 6px 20px rgba(79,192,109,.16)}
.b-bribe{background:linear-gradient(160deg,#d05f31,#8e3a1c);border-color:rgba(208,95,49,.6);box-shadow:0 6px 20px rgba(208,95,49,.18)}
.b-rest{background:linear-gradient(160deg,rgba(240,189,74,.24),rgba(240,189,74,.08));border-color:rgba(240,189,74,.45);color:#ffe9b4}
.b-info{background:linear-gradient(160deg,#3d80ba,#28587f);border-color:rgba(87,168,238,.55)}
.b-bad{background:linear-gradient(160deg,#e8483c,#932a22);border-color:rgba(232,72,60,.6);box-shadow:0 6px 22px rgba(232,72,60,.2)}
.b-acid{background:linear-gradient(160deg,#7fbc35,#4d7a1c);border-color:rgba(159,224,74,.55);color:#f2ffdf}
.b-ghost{background:rgba(255,255,255,.045);color:var(--muted)}

.log{flex-shrink:0;border-radius:15px;padding:11px 13px;font-size:12.5px;line-height:1.45;color:var(--muted);
  background:linear-gradient(160deg,var(--panel),rgba(13,18,25,.92));border:1px solid rgba(255,255,255,.07);border-left:3px solid var(--sand);animation:logIn .34s ease}
@keyframes logIn{0%{opacity:0;transform:translateY(9px)}100%{opacity:1;transform:none}}

.rule{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:11px 12px;font-size:13px;line-height:1.45;color:var(--muted)}
.rule b{color:var(--sand);margin-right:8px;font-weight:900}
.shop-list{display:grid;gap:6px}
.shop-item{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:11px 13px}
.shop-item .nm{display:flex;align-items:center;gap:9px;font-size:13.5px}
.shop-item .ef{font-size:9.5px;color:var(--muted);font-weight:700;margin-top:3px;display:block}
.shop-item b{color:var(--sand);white-space:nowrap;font-size:13px}
.inv{display:flex;gap:6px;flex-wrap:wrap}
.inv button{padding:9px 11px;font-size:12px}
.sec{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--sand);padding-left:2px}

.mini{position:relative;height:190px;border-radius:18px;background:linear-gradient(160deg,#0f1a24,#0a1119);border:1px solid rgba(87,168,238,.3);overflow:hidden}
.mini .bar1c{height:26px;background:linear-gradient(90deg,#2b5f8a,#1d3d59);display:flex;align-items:center;padding:0 10px;font-size:10.5px;font-weight:800;color:#cfe6fa;letter-spacing:.04em}
.mini .field{position:absolute;inset:26px 0 0 0}
.mini .mb{position:absolute;padding:11px 16px;font-size:13px;border-radius:11px;transition:left .28s cubic-bezier(.2,1.3,.4,1),top .28s cubic-bezier(.2,1.3,.4,1)}
.mini .timer{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--acid),var(--warn),var(--bad));transition:width .1s linear}
.mini .hint{position:absolute;left:12px;top:38px;font-size:11px;color:var(--muted)}

.loader{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
.loader .em{font-size:84px;animation:float 1.7s ease-in-out infinite;filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(4deg)}}
.loader h2{margin:0;font-size:31px;font-weight:900;letter-spacing:-.03em}
.loader .ph{font-size:19px;font-weight:900;color:var(--sand);min-height:26px;animation:phIn .4s ease}
@keyframes phIn{0%{opacity:0;transform:translateY(10px) scale(.94)}100%{opacity:1;transform:none}}
.track{width:min(330px,88%);height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--rust),var(--sand),var(--acid));transition:width 1s linear;box-shadow:0 0 18px rgba(240,189,74,.6)}
.loader .hint{font-size:11.5px;color:var(--muted)}

.tro{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tro .t{position:relative;overflow:hidden;border-radius:16px;padding:11px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(160deg,var(--panel2),var(--panel));opacity:.42;filter:grayscale(.85)}
.tro .t.got{opacity:1;filter:none;border-color:rgba(240,189,74,.45);box-shadow:0 0 20px rgba(240,189,74,.12)}
.tro .t.got:after{content:"";position:absolute;top:0;left:-120%;width:55%;height:100%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,70%{left:-120%}100%{left:150%}}
.tro .e{font-size:23px}
.tro .n{font-size:12px;font-weight:900;margin-top:5px;line-height:1.2}
.tro .d{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.3}

#fx{position:fixed;inset:0;z-index:65;pointer-events:none}
.float{position:absolute;font-weight:900;font-size:17px;text-shadow:0 3px 14px rgba(0,0,0,.85);animation:fly 1.15s cubic-bezier(.2,.85,.3,1) forwards}
@keyframes fly{0%{opacity:0;transform:translateY(8px) scale(.8)}16%{opacity:1;transform:translateY(-4px) scale(1.14)}100%{opacity:0;transform:translateY(-76px) scale(1)}}
#toasts{position:fixed;left:0;right:0;top:calc(12px + var(--tg-top));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{max-width:420px;width:100%;display:flex;gap:11px;align-items:center;padding:12px 14px;border-radius:16px;
  background:linear-gradient(140deg,rgba(240,189,74,.22),rgba(20,28,38,.97));border:1px solid rgba(240,189,74,.5);
  box-shadow:0 18px 40px rgba(0,0,0,.6);animation:tin .45s cubic-bezier(.16,1,.3,1)}
.toast.bad{background:linear-gradient(140deg,rgba(232,72,60,.24),rgba(20,28,38,.97));border-color:rgba(232,72,60,.5)}
.toast.info{background:linear-gradient(140deg,rgba(87,168,238,.22),rgba(20,28,38,.97));border-color:rgba(87,168,238,.5)}
.toast .te{font-size:26px}
.toast .tt{font-size:12.5px;font-weight:900}
.toast .td{font-size:11px;color:var(--muted);margin-top:2px}
.toast.out{animation:tout .35s ease forwards}
@keyframes tin{0%{opacity:0;transform:translateY(-26px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-18px) scale(.96)}}

.badge-end{display:inline-block;padding:6px 13px;border-radius:999px;font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.e-good{background:rgba(79,192,109,.18);color:#c6f2d5;border:1px solid rgba(79,192,109,.5)}
.e-bad{background:rgba(232,72,60,.18);color:#ffb7b0;border:1px solid rgba(232,72,60,.5)}
.e-mid{background:rgba(240,189,74,.18);color:#ffe9b4;border:1px solid rgba(240,189,74,.5)}
.e-sec{background:rgba(192,97,224,.18);color:#e9c6f7;border:1px solid rgba(192,97,224,.55)}
.rows{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
.rows div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed rgba(255,255,255,.08);padding-bottom:4px}
.rows b{color:var(--text)}
.share{font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.6;color:#cfe0f0;background:rgba(0,0,0,.4);border:1px dashed rgba(87,168,238,.35);border-radius:14px;padding:12px;white-space:pre-wrap}
@media (max-height:680px){.card-art{height:106px;font-size:56px}.hero h1{font-size:28px}.card-title{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

function tone(f,d,ty,v,dl,slide){ const c=ac(); if(!c)return; const t=c.currentTime+(dl||0);
  const o=c.createOscillator(),g=c.createGain(); o.type=ty||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(v||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);

(function(){ const cv=document.getElementById('dust'),cx=cv.getContext('2d'); let W,H,P=[],raf=0,dpr=Math.min(devicePixelRatio||1,2);

function Bloop(){ BX.clearRect(0,0,BC.width,BC.height);

const cl=(v,a,b)=>Math.min(b,Math.max(a,Number(v)||0));
let seed=0;
function rnd(){ if(seed){ seed|=0;seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } return Math.random(); }
const pick=a=>Array.isArray(a)&&a.length?a[Math.floor(rnd()*a.length)]:'';

function shuf(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

function norm(t){ return Object.assign({model:'',plate:'',emoji:'🚚',driver:'Водитель',driverEmoji:'🧑',driverDesc:'',text:'Приехала машина.',quote:'',patience:2,greed:1,gift:.12,canBribe:true,inBase:true},t); }
function truck(){ const t=tlist().find(x=>x.id===S.truckId); return t?norm(t):null; }
function isZhab(){ const t=truck(); return !!(t&&(t.zhab||/жабинск/i.test(t.driver||''))); }
function pat(){ return cl(100-S.vFat,0,100); }

function invAdd(id,n){ S.inv[id]=(S.inv[id]||0)+(n||1); if(S.inv[id]<=0) delete S.inv[id]; }
function txt(s){ const t=truck()||{driver:'Водитель',brand:'самосвал',weight:35};
  return String(s||'').replace(/\{driver\}/g,t.driver).replace(/\{brand\}/g,t.brand).replace(/\{tons\}/g,Math.round(S.theft)); }
function nextTruck(){

}

function apply(e){

  if(e.loyalty!==undefined&&e.loyalty!==0){ const b=S.loy;loy(e.loyalty);const d=Math.round(S.loy-b); if(d)fx((d>0?'+':'')+d+' 📈',d>0?'#57a8ee':'#e8483c'); }
  if(e.mood) S.mood=cl(S.mood+e.mood,0,100);
  if(e.energy) S.energy=cl(S.energy+e.energy,0,100);
  if(e.food) S.food=cl(S.food+e.food,0,100);

function allev(){ const out=[],seen={}; EV.concat(window.EVENTS||[]).forEach(e=>{ if(!e||!e.id||seen[e.id])return;seen[e.id]=1;
  const p=PATCH[e.id]; const o=p?Object.assign({},e,p):Object.assign({},e);
  if(o.minP!==undefined&&o.minProgress===undefined)o.minProgress=o.minP;

  for(const k in S.mod.evBias){ if(tags.some(t=>String(t).toLowerCase().indexOf(k)>=0)) m*=S.mod.evBias[k]; } return m; }
function roll(){

    if(e.minProgress!==undefined&&S.prog<e.minProgress) return false;
    if(e.maxProgress!==undefined&&S.prog>e.maxProgress) return false;
    if(e.minDrunk!==undefined&&S.drunk<e.minDrunk) return false;
    if(e.maxDrunk!==undefined&&S.drunk>e.maxDrunk) return false;
    if(e.minLoy!==undefined&&S.loy<e.minLoy) return false;
    if(e.minLoyalty!==undefined&&S.loy<e.minLoyalty) return false;
    if(e.maxLoyalty!==undefined&&S.loy>e.maxLoyalty) return false;
    if(e.minEnergy!==undefined&&S.energy<e.minEnergy) return false;
    if(e.maxEnergy!==undefined&&S.energy>e.maxEnergy) return false;
    if(e.maxMood!==undefined&&S.mood>e.maxMood) return false;
    if(e.minTheftTons!==undefined&&S.theft<e.minTheftTons) return false;
    if(e._maxPat!==undefined&&pat()>e._maxPat) return false;
    if(S.char==='valera'&&e.for!=='valera'&&!PATCH[e.id]&&/Валер[аыуе]\b/.test((e.title||'')+' '+(e.text||''))) return false;
    if(e.choices&&chFor(e).length===0) return false;
    return true; });
  if(!L.length) return null;
  if(S.lastEv){ const f=L.filter(e=>e.id!==S.lastEv); if(f.length)L=f; }
  const bag=[]; L.forEach(e=>{ const w=Math.max(1,Math.round((e.weight||10)*bias(e))); for(let i=0;i<w;i++)bag.push(e); });
  return pick(bag);
}

function mChance(kind){
  let c=kind==='bribe'?.07:.045;
  c+=S.drunk/210; c+=(100-S.energy)/380;
  if(S.food<25)c+=.05; if(S.gTimer>0)c+=.06; if(S.floor)c+=.03;
  if(phase()===3)c+=.03;
  if(S.mod&&S.mod.err)c+=S.mod.err;
  if(S.char==='valera')c-=.02;else c+=.01;
  return cl(c,.01,.82);
}
function doMiss(){
  S.mistakes++; apply({money:-100,loyalty:-7,mood:-6,progress:-1});
  if(pending())return;
  sfx('bad');buzzN('error');shake();flash('rgba(232,72,60,.3)');burst('bad',18);
  S.ev={title:'Косяк',emoji:'🤦',text:pick(MISS)};S.view='event';S.log=S.ev.text;save();render();

function work(kind){
  if(S.view!=='hub'||S.prog>=CFG.shift) return;
  const t=truck(); if(!t){nextTruck();render();return;}
  if((S.drunk>=42&&maybe(.5))||maybe(.1)){ startMini(kind); return; }
  resolveWork(kind,false);
}
function resolveWork(kind,miniOk){
  const t=truck(); if(!t) return;
  if(kind==='bribe'){
    if(!S.offer) return;
    const share=Math.round(S.offer/2);
    S.bribes++;CAR.bribes++;
    apply({money:share,theftTons:t.weight,loyalty:-3.5+(S.mod&&S.mod.bribeLoy||0),mood:5});
    S.log=pick(BRIBE_LOGS)+' Твоя доля: '+share+' ₽.';
    sfx('coin');buzz('heavy');stamp('налево','#d05f31');burst('coin',26);
  }else{
    S.honest++;
    let g=(S.char==='sasha'?2.2:1.6)+(miniOk?1.2:0);
    if(S.energy>70&&S.food>60)g+=.5;
    apply({money:200+(miniOk?80:0),loyalty:g,mood:1});
    S.log=pick(WORK_LOGS);
    if(t.gift&&maybe(t.gift)){ S.gifts++;apply({mood:8,food:6,energy:4});S.log+=' Водитель оставил подарок.';fx('🎁 подарок','#4fc06d'); }
    sfx('weigh');buzz('light');stamp('взвешено','#4fc06d');burst('sand',18);
  }
  apply({progress:1});
  const press=.55+(phase()-1)*.25+S.theft/140; loy(-press);
  S.energy=cl(S.energy-3+(S.mod&&S.mod.energy||0),0,100);
  S.food=cl(S.food-1.4+(S.mod&&S.mod.food||0),0,100);
  S.drunk=cl(S.drunk-1,0,100);
  if(S.mod&&S.mod.mood) S.mood=cl(S.mood+S.mod.mood,0,100);
  if(S.floor) S.mood=cl(S.mood-2,0,100);
  if(S.char==='sasha') S.vFat=cl(S.vFat-4,0,100); else S.vFat=cl(S.vFat+1,0,100);
  if(S.food<=20) apply({mood:-2,energy:-2,loyalty:-1});
  if(S.energy<=20) apply({loyalty:-1.5});
  if(kind!=='bribe'){
    if(S.drunk>=85){apply({loyalty:-6,mood:-3});S.log='Работаешь в хлам. Это видно даже по бумагам.';}
    else if(S.drunk>=60){apply({loyalty:-3});S.log='Пьяная работа. Начальство чувствует по почерку.';}
    else if(S.drunk>=35) apply({loyalty:-1});
  }
  if(S.gTimer>0){ S.gTimer--; }
  tickChains();
  if(S.loy<=0&&!S.zFlag) S.pending='zero';
  if(pending()) return;
  if(maybe(mChance(kind))){ doMiss(); return; }
  if(S.gTimer===0&&S.gulya>0&&S.chains.every(c=>c.id!=='c_gulya')&&!S.usedG){ S.usedG=true; queue('c_gulya',0); }
  const due=dueChain(); if(due){ showEv(due); return; }
  const chance=(kind==='bribe'?CFG.evBribe:CFG.evWork)+(phase()-1)*.04;
  if(maybe(chance)){ const e=roll(); if(e){showEv(e);return;} }
  nextTurn();
}

function gDone(){ return S.goals.filter(id=>{const g=GOALS.find(x=>x.id===id);return g&&g.f(S);}).length; }
function finish(){
  stopMini();
  const done=gDone(),bonus=done*1800;
  S.money+=bonus; S.endBonus=bonus;
  CAR.shifts++;CAR.wShift++;CAR.wMoney+=S.money;CAR.best=Math.max(CAR.best,S.money);
  unlock('marathon');
  if(done===3&&S.mistakes===0) unlock('perfect');
  if(!S.everDrunk) unlock('dry');
  if(S.bribes===0) unlock('conscience');
  let weekEnd=false;
  if(CAR.wShift>=7){ weekEnd=true;CAR.weeks++; if(CAR.wMoney>=80000) unlock('bank'); }
  let kind='mid',text='';
  const dead=S.loy<=0||S.mistakes>=9||S.theft>=230;
  if(S.char==='sasha'){
    if(dead){kind='bad';text='Начальство приехало лично, склад плачет, песок исчез. Саша первым написал заявление — говорит, сам захотел.';}
    else if(S.sleeps>=5&&S.loy>=62){kind='sec';text='СЕКРЕТНАЯ: «Спящий гений». Он проспал половину вахты, но по отчётам — лучший весовщик объекта. Никто так и не понял, как.';}
    else if(done>=2&&S.money>=14000){kind='good';text='Задачи закрыты, деньги есть, Валера устал, начальство довольно. Классический Саша.';}
    else {kind='mid';text='Никто не понял, что он делал, но смена закрыта и кошелёк не пустой.';}
  }else{
    if(dead){kind='bad';text='Начальник участка орал так, что весы обнулились. Валера ушёл в закат, захватив кружку и достоинство.';}
    else if(S.loy>=68&&S.mistakes<=2&&S.theft<=20){kind='good';text='Взвесил всё, починил всё, никого не подставил. Единственный человек на объекте, которому можно доверять.';}
    else if(S.bribes>=6&&S.money>=18000){kind='sec';text='СЕКРЕТНАЯ: «Тихий омут». Валера всю жизнь был правильным, а потом просто перестал. И оказался в этом подозрительно хорош.';}
    else {kind='mid';text='Спина болит, 1С висит, премия «в следующем месяце». Но смену он снова вытащил.';}
  }
  if(weekEnd){ text+=' ВАХТА ЗАКРЫТА: '+CAR.wShift+' смен, '+Math.round(CAR.wMoney)+' ₽ в копилке'+(CAR.wMoney>=80000?'. Цель взята!':'. Цель не взята, но ты жив.'); CAR.wShift=0;CAR.wMoney=0; }
  S.endKind=kind;S.endText=text;S.screen='end';
  sfx(kind==='bad'?'boss':'win');buzzN(kind==='bad'?'error':'success');
  if(kind!=='bad') burst('star',44);
  checkAch();save();render();
}
function shareResult(){
  const t='ОБЪЕКТ «МИРАЖ»\nВесовщик: '+(ch()?ch().name:'—')+'\nМашины: '+S.prog+'/60\nДеньги: '+Math.round(S.money)+' ₽\nНалево: '+Math.round(S.theft)+' т\nОпьянение: '+Math.round(S.drunk)+'%\nКосяки: '+S.mistakes+'\nЗадачи: '+gDone()+'/3\n\n'+(S.endText||'');

  try{ if(tg&&tg.openTelegramLink){ tg.openTelegramLink(url); return; } }catch(e){}
  if(navigator.share){ navigator.share({title:'Весовщики: Мираж',text:t}).catch(()=>{}); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>toast('Результат скопирован','📋','info','Вставь в чат и хвастайся.')); return; }

   '<div class="goals">'+S.goals.map(id=>{const g=GOALS.find(x=>x.id===id);if(!g)return '';const ok=g.f(S);return '<div class="goal'+(ok?' done':'')+'">'+(ok?'✓ ':'✕ ')+g.t+'</div>';}).join('')+'</div>'+
   '<div class="share">'+share+'</div>'+
   '<div class="grid2"><button class="b-work" onclick="newShift(\''+S.char+'\')">Ещё смена</button><button class="b-info" onclick="shareResult()">📤 Поделиться</button></div>'+
   '<div class="grid2"><button class="b-ghost" onclick="openTro()">🏆 Трофеи</button><button class="b-ghost" onclick="toStart()">Сменить весовщика</button></div>'+
   '<div class="rule">'+pick(rpool())+'</div>';
}
const PH=[{t:'Ищу песок',e:'🔍'},{t:'Нахожу песок',e:'🏜'},{t:'Жую песок',e:'🥪'},{t:'Типичная вахта',e:'🌙'}];
function loadUI(){ const p=PH[Math.min(S.phase,PH.length-1)],w=Math.min(100,(S.phase+1)/PH.length*100);
  return '<div class="loader"><div class="em">'+p.e+'</div><h2>Объект «Мираж»</h2><div class="ph">'+p.t+'</div><div class="track"><i style="width:'+w+'%"></i></div><div class="hint">Разогреваем весы и запускаем 1С…</div></div>'; }
function render(){
  const box=document.getElementById('scroll'); if(!box)return;
  if(S.screen==='game'&&!ch()) S.screen='start';
  let h='';
  if(S.screen==='loading')h=loadUI();
  else if(S.screen==='start')h=startUI();
  else if(S.screen==='rules')h=rulesUI();
  else if(S.screen==='tro')h=troUI();
  else if(S.screen==='end')h=endUI();
  else h=gameUI();
  box.innerHTML=h; box.scrollTop=0; paintTop(); syncVP();
  if(S.view==='mini'&&S.mini){ const b=document.getElementById('mrun'); if(b&&S.mini.step>0){b.style.display='block';b.style.left=S.mini.x+'%';b.style.top=S.mini.y+'%';} }
}

/* ══════════ BOOT ══════════ */
function ls(src){ return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s);}); }
function uniq(a){ const s={};return (a||[]).filter(x=>{const k=x&&x.id?x.id:JSON.stringify(x);if(s[k])return false;s[k]=1;return true;}); }
async function boot(){
  const jobs=[];
  for(let i=1;i<=MAXF;i++){ ['cards','events','shop','rules'].forEach(p=>jobs.push(ls(p+'-'+i+'.js').catch(()=>{}))); }
  await Promise.all(jobs);
  window.TRUCKS=uniq(window.TRUCKS);window.EVENTS=uniq(window.EVENTS);window.SHOP=uniq(window.SHOP);window.RULES=uniq(window.RULES);
  loadAll(); paintTop(); syncVP();
  S.screen='loading';S.phase=0;render();
  const iv=setInterval(()=>{ S.phase++;sfx('tick');
    if(S.phase>=PH.length){clearInterval(iv);S.screen='start';save();render();} else render(); },1000);
}
boot();
</script>
</body>

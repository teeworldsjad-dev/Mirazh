<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#080b11" />
<title>Весовщики: Мираж</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --night:#080b11; --asphalt:#0e131c; --panel:#151d29; --panel-2:#1d2735; --overlay:#232f40;
  --sand:#e9b949; --sand-deep:#c8942a; --rust:#c85a34; --diesel:#4a7f8c;
  --ok:#4fbf6a; --warn:#e9a13b; --bad:#e2483f; --info:#5aa9e6; --weird:#b866d9;
  --text:#f4efe3; --muted:#8d9aab; --line:rgba(233,185,73,.16);
  --app-h:100dvh; --tg-top:0px; --tg-bottom:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--night)}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);
  touch-action:manipulation;
  background:
    radial-gradient(120% 70% at 12% -10%, rgba(233,185,73,.16), transparent 60%),
    radial-gradient(90% 60% at 92% 4%, rgba(74,127,140,.18), transparent 62%),
    radial-gradient(80% 60% at 50% 110%, rgba(200,90,52,.14), transparent 60%),
    var(--night);
}
#dust{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.app{position:relative;z-index:2;width:100%;max-width:560px;margin:0 auto;height:100vh;height:100dvh;height:var(--app-h);
  display:flex;flex-direction:column;overflow:hidden;
  padding:calc(8px + var(--tg-top)) 10px calc(8px + var(--tg-bottom));}
.app.shake{animation:shake .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

.topbar{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.14em;font-size:11px;text-transform:uppercase;color:var(--sand);
  background:linear-gradient(135deg,rgba(233,185,73,.16),rgba(200,90,52,.10));border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--sand);box-shadow:0 0 10px var(--sand);animation:blink 2.4s infinite}
@keyframes blink{0%,88%,100%{opacity:1}92%{opacity:.25}}
.topbar .spacer{flex:1}
.icon-btn{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:16px;cursor:pointer;transition:.15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.off{color:var(--muted);opacity:.7}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding-right:4px;
  scrollbar-width:thin;scrollbar-color:var(--sand-deep) rgba(255,255,255,.05)}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:99px}
.scroll::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--sand),var(--rust));border-radius:99px;border:2px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ffd166,var(--rust));background-clip:padding-box}

.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px;border:1px solid var(--line);
  background:linear-gradient(150deg,rgba(233,185,73,.10),rgba(21,29,41,.9) 45%,rgba(200,90,52,.12));
  box-shadow:0 18px 40px rgba(0,0,0,.45)}
.hero:before{content:"";position:absolute;inset:-40% -10% auto auto;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(233,185,73,.22),transparent 65%);filter:blur(6px)}
.hero h1{position:relative;margin:0 0 6px;font-size:32px;line-height:1;letter-spacing:-.03em;font-weight:900}
.hero h1 span{color:var(--sand)}
.hero p{position:relative;margin:0;color:var(--muted);font-size:14px;line-height:1.45}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex-shrink:0}
.stat{background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:7px 5px;text-align:center;position:relative;overflow:hidden}
.stat small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.02em;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.stat b{font-size:15px;line-height:1;display:block}
.stat .bar{position:absolute;left:0;bottom:0;height:3px;transition:width .4s ease}
.stat.s-money b{color:var(--sand)} .stat.s-loy b{color:var(--info)} .stat.s-mood b{color:var(--weird)} .stat.s-theft b{color:var(--rust)}
.stat.s-drunk b{color:var(--warn)} .stat.s-energy b{color:var(--ok)} .stat.s-food b{color:#d9a06b} .stat.s-trucks b{color:var(--diesel)}
.stat.flash{animation:statFlash .5s ease}
@keyframes statFlash{0%{box-shadow:0 0 0 0 rgba(233,185,73,.5)}100%{box-shadow:0 0 0 12px rgba(233,185,73,0)}}

.goals{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.goal{font-size:10.5px;font-weight:800;padding:6px 9px;border-radius:999px;border:1px dashed rgba(255,255,255,.16);color:var(--muted);background:rgba(255,255,255,.03)}
.goal.done{border-style:solid;border-color:rgba(79,191,106,.5);color:#bff0cd;background:rgba(79,191,106,.12)}

.card{position:relative;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.09);flex-shrink:0;
  background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(21,29,41,.96));box-shadow:0 20px 46px rgba(0,0,0,.5);
  animation:cardIn .38s cubic-bezier(.2,.85,.25,1)}
@keyframes cardIn{0%{opacity:0;transform:translateY(20px) scale(.95) rotate(1.2deg)}100%{opacity:1;transform:none}}
.card-art{position:relative;height:132px;display:grid;place-items:center;font-size:66px;
  background:radial-gradient(circle at 22% 25%,rgba(233,185,73,.22),transparent 55%),radial-gradient(circle at 80% 80%,rgba(74,127,140,.22),transparent 55%),var(--panel-2)}
.card-art:after{content:"";position:absolute;inset:auto 0 0 0;height:34px;background:linear-gradient(transparent,rgba(8,11,17,.85))}
.card-art .beam{position:absolute;top:-30px;left:-20%;width:60%;height:190px;transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(233,185,73,.14),transparent);animation:beam 6s linear infinite}
@keyframes beam{0%{left:-40%}100%{left:110%}}
.card-body{padding:14px 15px 16px;display:grid;gap:9px}
.card-title{font-size:25px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.card-sub{font-size:12px;color:var(--sand);font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted);border:1px solid rgba(255,255,255,.06)}
.chip.warn{color:#ffd79a;border-color:rgba(233,161,59,.4);background:rgba(233,161,59,.12)}
.chip.bad{color:#ffb4ae;border-color:rgba(226,72,63,.4);background:rgba(226,72,63,.12)}
.chip.ok{color:#bff0cd;border-color:rgba(79,191,106,.4);background:rgba(79,191,106,.12)}
.chip.info{color:#bcdcf7;border-color:rgba(90,169,230,.4);background:rgba(90,169,230,.12)}
.driver{display:flex;gap:10px;align-items:flex-start;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:10px 11px}
.driver .face{font-size:26px;line-height:1}
.driver .who{font-size:13px;font-weight:900;color:var(--text)}
.driver .desc{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.quote{font-size:13.5px;color:var(--sand);font-weight:700;line-height:1.35;border-left:3px solid var(--rust);padding-left:10px}
.card-text{font-size:13.5px;color:var(--muted);line-height:1.42}

.actions{display:grid;gap:7px;flex-shrink:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{font-family:inherit;border:0;border-radius:15px;padding:13px 12px;font-size:14.5px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(160deg,var(--overlay),var(--panel-2));border:1px solid rgba(255,255,255,.08);transition:transform .09s,filter .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.42;filter:grayscale(.6);cursor:not-allowed}
button small{display:block;font-size:10.5px;font-weight:700;opacity:.8;margin-top:3px}
.b-work{background:linear-gradient(160deg,#3f9e5c,#2c7546);border-color:rgba(79,191,106,.5)}
.b-bribe{background:linear-gradient(160deg,#c85a34,#8f3a20);border-color:rgba(200,90,52,.55)}
.b-rest{background:linear-gradient(160deg,rgba(233,185,73,.22),rgba(233,185,73,.08));border-color:rgba(233,185,73,.4);color:#ffe6ac}
.b-ghost{background:rgba(255,255,255,.04);color:var(--muted)}
.b-info{background:linear-gradient(160deg,#3d7fb5,#2a5a84);border-color:rgba(90,169,230,.5)}

.log{flex-shrink:0;border-radius:15px;padding:11px 13px;font-size:13px;line-height:1.4;color:var(--muted);
  background:linear-gradient(160deg,var(--panel),rgba(14,19,28,.9));border:1px solid rgba(255,255,255,.07);border-left:3px solid var(--sand);
  animation:logIn .3s ease}
@keyframes logIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}

.rule{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:11px 12px;font-size:13.5px;line-height:1.4;color:var(--muted)}
.rule b{color:var(--sand);margin-right:7px;font-weight:900}
.shop-list{display:grid;gap:6px}
.shop-item{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:11px 13px}
.shop-item .nm{display:flex;align-items:center;gap:9px;font-size:14px}
.shop-item .ef{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
.shop-item b{color:var(--sand);white-space:nowrap}

.loader{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
.loader .em{font-size:82px;animation:float 1.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.loader h2{margin:0;font-size:30px;font-weight:900;letter-spacing:-.02em}
.loader .ph{font-size:19px;font-weight:900;color:var(--sand);min-height:26px;animation:logIn .35s ease}
.track{width:min(320px,86%);height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--rust),var(--sand));transition:width 1s linear;box-shadow:0 0 14px rgba(233,185,73,.6)}
.loader .hint{font-size:12px;color:var(--muted)}

#fx{position:fixed;inset:0;z-index:40;pointer-events:none}
.float{position:absolute;font-weight:900;font-size:17px;text-shadow:0 3px 12px rgba(0,0,0,.8);animation:fly 1.05s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes fly{0%{opacity:0;transform:translateY(6px) scale(.85)}18%{opacity:1;transform:translateY(-4px) scale(1.08)}100%{opacity:0;transform:translateY(-64px) scale(1)}}
.badge-end{display:inline-block;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.end-good{background:rgba(79,191,106,.16);color:#bff0cd;border:1px solid rgba(79,191,106,.45)}
.end-bad{background:rgba(226,72,63,.16);color:#ffb4ae;border:1px solid rgba(226,72,63,.45)}
.end-mid{background:rgba(233,185,73,.16);color:#ffe6ac;border:1px solid rgba(233,185,73,.45)}
.end-secret{background:rgba(184,102,217,.16);color:#e6c4f5;border:1px solid rgba(184,102,217,.5)}
.rows{display:grid;gap:5px;font-size:13.5px;color:var(--muted)}
.rows div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.07);padding-bottom:4px}
.rows b{color:var(--text)}
@media (max-height:660px){.card-art{height:104px;font-size:54px}.hero h1{font-size:27px}.card-title{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="dust"></canvas><div class="grain"></div>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand"><i></i>Объект «Мираж»</div>
    <div class="spacer"></div>
    <button class="icon-btn" id="btnFs" onclick="goFullscreen()" title="Во весь экран">⛶</button>
    <button class="icon-btn" id="btnSnd" onclick="toggleSound()" title="Звук">🔊</button>
  </div>
  <div class="scroll" id="scroll"><div class="loader"><div class="em">🏗</div><h2>Мираж</h2><div class="ph">Разогреваем весы…</div></div></div>
</div>
<div id="fx"></div>

<script>
/* ============ TELEGRAM ============ */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
function syncViewport(){
  const h = (tg && (tg.viewportStableHeight||tg.viewportHeight)) || window.innerHeight;
  document.documentElement.style.setProperty('--app-h', h+'px');
  const sa = (tg && tg.safeAreaInset) || {top:0,bottom:0};
  const ca = (tg && tg.contentSafeAreaInset) || {top:0,bottom:0};
  const envT = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--envt'))||0;
  document.documentElement.style.setProperty('--tg-top', Math.max(sa.top||0, ca.top||0, envT)+'px');
  document.documentElement.style.setProperty('--tg-bottom', Math.max(sa.bottom||0, ca.bottom||0)+'px');
  const fs = document.getElementById('btnFs');
  if(fs) fs.classList.toggle('off', !!(tg && tg.isFullscreen));
}
function goFullscreen(){
  if(!tg){ syncViewport(); return; }
  try{
    tg.expand();
    if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if(tg.requestFullscreen && !tg.isFullscreen) tg.requestFullscreen();
  }catch(e){}
  syncViewport(); setTimeout(syncViewport,120); setTimeout(syncViewport,450);
}
(function initTG(){
  if(!tg){ syncViewport(); return; }
  try{
    tg.ready(); tg.expand();
    if(tg.setHeaderColor) tg.setHeaderColor('#080b11');
    if(tg.setBackgroundColor) tg.setBackgroundColor('#080b11');
    if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if(tg.onEvent){
      tg.onEvent('viewportChanged', syncViewport);
      tg.onEvent('fullscreenChanged', syncViewport);
      tg.onEvent('safeAreaChanged', syncViewport);
      tg.onEvent('contentSafeAreaChanged', syncViewport);
    }
  }catch(e){}
  syncViewport();
  setTimeout(goFullscreen,250);
})();
window.addEventListener('resize', syncViewport);
window.addEventListener('orientationchange', ()=>{setTimeout(syncViewport,150);setTimeout(goFullscreen,320);});
document.addEventListener('pointerdown', function once(){ goFullscreen(); document.removeEventListener('pointerdown', once); }, {once:true});
document.addEventListener('gesturestart', e=>e.preventDefault());
function buzz(t){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} }
function buzzN(t){ try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t||'success'); }catch(e){} }

/* ============ AUDIO ============ */
let AC=null;
function ac(){ if(!S.sound) return null; if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type,v,delay){ const c=ac(); if(!c) return; const t=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.02); }
function noise(d,v){ const c=ac(); if(!c) return; const n=c.sampleRate*d, b=c.createBuffer(1,n,c.sampleRate), ch=b.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n); const s=c.createBufferSource(); s.buffer=b;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1400; const g=c.createGain(); g.gain.value=v||.05;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(); }
const SFX={
  click(){tone(300,.05,'square',.03)},
  weigh(){tone(430,.07,'triangle',.05);tone(660,.09,'triangle',.04,.07);noise(.12,.03)},
  coin(){tone(880,.06,'square',.04);tone(1240,.09,'square',.035,.06);tone(1560,.1,'sine',.03,.13)},
  bad(){tone(150,.16,'sawtooth',.06);tone(92,.2,'sawtooth',.05,.13)},
  event(){tone(620,.06,'sine',.04);tone(830,.07,'sine',.035,.07)},
  sleep(){tone(200,.22,'sine',.05);tone(140,.28,'sine',.04,.16)},
  shop(){tone(950,.05,'triangle',.04);tone(1300,.05,'triangle',.03,.05)},
  boss(){tone(110,.3,'sawtooth',.07);tone(80,.4,'square',.05,.18)},
  win(){tone(520,.1,'sine',.05);tone(780,.1,'sine',.05,.1);tone(1040,.22,'sine',.05,.2)},
  tick(){tone(480,.04,'sine',.025)}
};
function sfx(n){ if(S.sound && SFX[n]) SFX[n](); }
function toggleSound(){ S.sound=!S.sound; save(); paintTop(); if(S.sound) sfx('click'); buzz('light'); }
function paintTop(){ const b=document.getElementById('btnSnd'); if(b){ b.textContent=S.sound?'🔊':'🔇'; b.classList.toggle('off',!S.sound);} }

/* ============ DUST ============ */
(function dust(){
  const cv=document.getElementById('dust'), cx=cv.getContext('2d');
  let W=0,H=0,P=[],raf=0,dpr=Math.min(devicePixelRatio||1,2);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ W=cv.width=innerWidth*dpr; H=cv.height=innerHeight*dpr; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    const n=Math.min(70, Math.round(innerWidth*innerHeight/16000)); P=[];
    for(let i=0;i<n;i++) P.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.9+.4)*dpr,vx:(Math.random()*.22+.05)*dpr,vy:(-Math.random()*.16-.02)*dpr,a:Math.random()*.5+.15,h:Math.random()<.25?'200,90,52':'233,185,73'});
  }
  function loop(){ cx.clearRect(0,0,W,H);
    for(const p of P){ p.x+=p.vx; p.y+=p.vy; if(p.x>W+8)p.x=-8; if(p.y<-8)p.y=H+8;
      cx.beginPath(); cx.fillStyle='rgba('+p.h+','+p.a+')'; cx.arc(p.x,p.y,p.r,0,6.283); cx.fill(); }
    raf=requestAnimationFrame(loop); }
  size(); if(!reduce) loop(); else { cx.clearRect(0,0,W,H); }
  addEventListener('resize', ()=>{ size(); });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){cancelAnimationFrame(raf);raf=0;} else if(!raf&&!reduce) loop(); });
})();

/* ============ CONTENT DEFAULTS ============ */
window.TRUCKS=window.TRUCKS||[]; window.EVENTS=window.EVENTS||[]; window.SHOP=window.SHOP||[]; window.RULES=window.RULES||[];
const MAXFILES=20;
const CFG={name:'Мираж', shift:60, evWork:.30, evBribe:.36};

const BASE_TRUCKS=[
 {id:'t_kamaz_zhab',brand:'КАМАЗ',model:'6520',cargo:'песок',weight:35,plate:'Х555УМ',emoji:'🚚',driver:'Жабинский',driverEmoji:'🐸',
  driverDesc:'Рожа такая, что хочется плюнуть, но по технике безопасности нельзя. Смотрит — будто ты ему должен за прошлую смену.',
  text:'Заехал, не глушится, окно открыл настежь. В кабине пахнет соляркой и претензиями.',quote:'Командир, тут лишние две тонны. Забудем?',
  patience:1,greed:1.6,gift:.02,canBribe:true,numberInBase:true},
 {id:'t_howo_batya',brand:'Howo',model:'ZZ3257',cargo:'песок',weight:38,plate:'М703АВ',emoji:'🚛',driver:'Батя',driverEmoji:'🧔',
  driverDesc:'Здоровается первым, кормит всех пирожками жены и считает 1С личным врагом.',
  text:'На весах встал ровно, но программу называет «этой твоей шарманкой».',quote:'Сынок, она у тебя живая вообще? Держи пирожок.',

const clamp=(v,a,b)=>Math.min(b,Math.max(a,Number(v)||0));
const pick=a=>Array.isArray(a)&&a.length?a[Math.floor(Math.random()*a.length)]:'';
const maybe=p=>Math.random()<p;
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function char(){ return CHARS.find(c=>c.id===S.char)||null; }
function trucks(){ return window.TRUCKS.length?window.TRUCKS:BASE_TRUCKS; }
function shop(){ return window.SHOP.length?window.SHOP:BASE_SHOP; }
function rulesPool(){ const p=(window.RULES&&window.RULES.length)?window.RULES:BASE_RULES; return p.map(r=>typeof r==='string'?r:(r&&r.text)||'').filter(Boolean); }
function normTruck(t){ return Object.assign({model:'',plate:'',emoji:'🚚',driver:'Водитель',driverEmoji:'🧑',driverDesc:'',text:'Приехала машина.',quote:'',patience:2,greed:1,gift:.12,canBribe:true,numberInBase:true},t); }
function getTruck(){ const t=trucks().find(x=>x.id===S.truckId); return t?normTruck(t):null; }
function driverKey(t){ return (t.driver||'x').toLowerCase().replace(/\s+/g,'_'); }
function mem(t){ const k=driverKey(t); if(!S.drivers[k]) S.drivers[k]={met:0,bribed:0,refused:0,gifts:0}; return S.drivers[k]; }
function nextTruck(){
  const list=trucks(); if(!list.length) return null;
  if(!S.bag.length) S.bag=shuffle(list.map(t=>t.id));
  let id=S.bag.pop();
  if(id===S.truckId && S.bag.length){ const alt=S.bag.pop(); S.bag.push(id); id=alt; }
  const t=normTruck(list.find(x=>x.id===id)||list[0]);
  S.truckId=t.id;
  const m=mem(t); m.met++;
  S.offer = t.canBribe ? Math.round(5000*t.greed*(1+Math.min(m.bribed,4)*.06)/250)*250 : 0;
  return t;
}
function phase(){ return S.progress<20?1:S.progress<40?2:3; }
function phaseName(){ return ['','Утро','Разгар','Финал'][phase()]; }

/* Лояльность: рост с затуханием, падения в полную силу */
function loyalty(delta){
  if(!delta) return;
  let d=delta;
  if(d>0) d = d * clamp((100-S.loyalty)/55,.12,1);
  S.loyalty = clamp(S.loyalty+d,0,100);
}
function fx(text,color){
  const l=document.getElementById('fx'); const d=document.createElement('div');
  d.className='float'; d.textContent=text; d.style.color=color||'#e9b949';
  d.style.left=(30+Math.random()*40)+'%'; d.style.top=(52+Math.random()*10)+'%';
  l.appendChild(d); setTimeout(()=>d.remove(),1100);
}
function shake(){ const a=document.getElementById('app'); a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'),360); }

function apply(e){
  if(!e) return;
  if(e.money){ const before=S.money; S.money=Math.max(0,S.money+e.money); const d=S.money-before; if(d) fx((d>0?'+':'')+d+' ₽', d>0?'#e9b949':'#e2483f'); }
  if(e.loyalty!==undefined && e.loyalty!==0){ const b=S.loyalty; loyalty(e.loyalty); const d=Math.round(S.loyalty-b); if(d) fx((d>0?'+':'')+d+' 📈', d>0?'#5aa9e6':'#e2483f'); }
  if(e.mood) S.mood=clamp(S.mood+e.mood,0,100);
  if(e.energy) S.energy=clamp(S.energy+e.energy,0,100);
  if(e.food) S.food=clamp(S.food+e.food,0,100);
  if(e.drunk!==undefined) S.drunk=clamp(S.drunk+e.drunk,0,100);
  if(e.theftTons) S.theftTons=Math.max(0,S.theftTons+e.theftTons);
  if(e.valeraFatigue) S.valeraFatigue=clamp(S.valeraFatigue+e.valeraFatigue,0,100);
  if(e.progress) S.progress=clamp(S.progress+e.progress,0,CFG.shift);
  if(e.missedTrucks) S.progress=Math.max(0,S.progress-e.missedTrucks);
  if(S.drunk>=100 && !S.drunkFlag) S.pending='drunk';
  if(S.loyalty<=0 && !S.zeroFlag) S.pending='zero';
  if(S.drunk<50) S.drunkFlag=false;
  if(S.loyalty>10) S.zeroFlag=false;
}

/* ============ EVENTS ============ */
function allEvents(){
  const out=[]; const seen={};
  BASE_EVENTS.concat(window.EVENTS||[]).forEach(ev=>{
    if(!ev||!ev.id||seen[ev.id]) return; seen[ev.id]=1;
    const p=EVENT_PATCH[ev.id]; out.push(p?Object.assign({},ev,p):ev);
  });
  return out;
}
function findEv(id){ return allEvents().find(e=>e.id===id)||null; }
function choicesFor(ev){
  let ch=(ev.choices||[]).slice();
  if(S.char==='valera') ch=ch.filter(c=>!/Валер[аыуе]/.test(c.label||''));
  return ch;
}
function rollEvent(){
  const c=char(); if(!c) return null;
  let list=allEvents().filter(e=>{
    if(e.trigger && e.trigger!=='work') return false;
    if(e.for && e.for!=='all' && e.for!==c.id) return false;
    if(e.once && S.usedEvents.indexOf(e.id)>=0) return false;
    if(e.minProgress!==undefined && S.progress<e.minProgress) return false;
    if(e.maxProgress!==undefined && S.progress>e.maxProgress) return false;
    if(e.minDrunk!==undefined && S.drunk<e.minDrunk) return false;
    if(e.maxDrunk!==undefined && S.drunk>e.maxDrunk) return false;
    if(e.minLoyalty!==undefined && S.loyalty<e.minLoyalty) return false;
    if(e.maxLoyalty!==undefined && S.loyalty>e.maxLoyalty) return false;
    if(e.minEnergy!==undefined && S.energy<e.minEnergy) return false;
    if(e.maxEnergy!==undefined && S.energy>e.maxEnergy) return false;
    if(e.minFood!==undefined && S.food<e.minFood) return false;
    if(e.maxFood!==undefined && S.food>e.maxFood) return false;
    if(e.minMood!==undefined && S.mood<e.minMood) return false;
    if(e.maxMood!==undefined && S.mood>e.maxMood) return false;
    if(e.minTheftTons!==undefined && S.theftTons<e.minTheftTons) return false;
    if(e.maxTheftTons!==undefined && S.theftTons>e.maxTheftTons) return false;
    if(e.minValeraFatigue!==undefined && S.valeraFatigue<e.minValeraFatigue) return false;
    if(S.char==='valera' && e.for!=='valera' && !EVENT_PATCH[e.id] && /Валер[аыуе]\b/.test((e.title||'')+' '+(e.text||''))) return false;
    if(choicesFor(e).length===0 && e.choices) return false;
    return true;
  });
  if(!list.length) return null;
  if(S.lastEv){ const f=list.filter(e=>e.id!==S.lastEv); if(f.length) list=f; }
  const bag=[]; list.forEach(e=>{ const w=Math.max(1,e.weight||10); for(let i=0;i<w;i++) bag.push(e); });
  return pick(bag);
}
function showEv(ev){
  if(!ev) return;
  if(ev.once && S.usedEvents.indexOf(ev.id)<0) S.usedEvents.push(ev.id);
  S.lastEv=ev.id||null;
  const isChoice=!!(ev.choices && choicesFor(ev).length);
  if(!isChoice && ev.effects) apply(ev.effects);

function mistakeChance(kind){
  let c = kind==='bribe'?.07:.045;
  c += S.drunk/210;
  c += (100-S.energy)/380;
  if(S.food<25) c+=.05;
  if(phase()===3) c+=.03;
  if(S.char==='valera') c-=.02; else c+=.01;
  return clamp(c,.01,.8);
}
function doMistake(){
  S.mistakes++;
  apply({money:-100,loyalty:-7,mood:-6,progress:-1});
  if(pendingSpecial()) return;
  sfx('bad'); buzzN('error'); shake();
  S.ev={title:'Косяк',emoji:'🤦',text:pick(MISS)}; S.view='event'; S.log=S.ev.text; save(); render();
}
function work(kind){
  if(S.view!=='hub'||S.progress>=CFG.shift) return;
  const t=getTruck(); if(!t) { nextTruck(); render(); return; }
  const m=mem(t);
  if(kind==='bribe'){
    if(!S.offer) return;
    const share=Math.round(S.offer/2);
    S.bribes++; m.bribed++;
    apply({money:share,theftTons:t.weight,loyalty:-3.5,mood:5});
    S.log=pick(BRIBE_LOGS)+' Твоя доля: '+share+' ₽.';
    sfx('coin'); buzz('heavy');
  }else{
    S.honest++;
    let g = S.char==='sasha'?2.2:1.6;
    if(S.energy>70&&S.food>60) g+=.5;
    apply({money:200,loyalty:g,mood:1});
    S.log=pick(WORK_LOGS);
    if(t.gift && maybe(t.gift)){ S.gifts++; m.gifts++; apply({mood:8,food:6,energy:4}); S.log+=' Водитель оставил подарок на подоконнике.'; fx('🎁 подарок','#4fbf6a'); }
    sfx('weigh'); buzz('light');
  }
  apply({progress:1});
  /* давление плана и воровства */
  const press = .55 + (phase()-1)*.25 + S.theftTons/140;
  loyalty(-press);
  S.energy=clamp(S.energy-3,0,100); S.food=clamp(S.food-1.4,0,100); S.drunk=clamp(S.drunk-1,0,100);
  if(S.char==='sasha') S.valeraFatigue=clamp(S.valeraFatigue-4,0,100);
  if(S.food<=20){ apply({mood:-2,energy:-2,loyalty:-1}); }
  if(S.energy<=20){ apply({loyalty:-1.5}); }
  if(kind!=='bribe'){
    if(S.drunk>=85){ apply({loyalty:-6,mood:-3}); S.log='Работаешь в хлам. Это видно даже по бумагам.'; }
    else if(S.drunk>=60){ apply({loyalty:-3}); S.log='Пьяная работа. Начальство такое чувствует по почерку.'; }
    else if(S.drunk>=35){ apply({loyalty:-1}); }
  }
  if(S.loyalty<=0&&!S.zeroFlag) S.pending='zero';
  if(pendingSpecial()) return;
  if(maybe(mistakeChance(kind))){ doMistake(); return; }
  const chance=(kind==='bribe'?CFG.evBribe:CFG.evWork)+(phase()-1)*.04;
  if(maybe(chance)){ const e=rollEvent(); if(e){ showEv(e); return; } }
  nextTurn();
}
function nextTurn(){
  if(S.progress>=CFG.shift){ startInspection(); return; }
  S.view='hub'; S.ev=null; nextTruck(); save(); render();
}
function hub(id){
  if(S.view!=='hub') return; sfx('click'); buzz('light');
  if(id==='work'||id==='bribe') return work(id);
  if(id==='shop'){ S.view='shop'; S.shopMsg='Ларёк у охраны. Всё есть, если есть деньги.'; save(); render(); return; }
  if(id==='sleep'){ if(S.char!=='sasha') return; S.view='sleep'; S.sleepMsg='Саша лёг на матрас в вагончике. Снаружи гудит самосвал — но это уже не его проблема.'; save(); render(); return; }
  if(id==='smoke'){ return smoke(); }
}
function driverLeaves(reason){
  const t=getTruck(); const pat=t?t.patience:2;
  const chance=clamp(.42-(pat-1)*.13,.08,.5);
  if(!maybe(chance)) return false;
  const m=t?mem(t):null; if(m) m.refused++;
  apply({progress:1});
  if(S.char==='valera') apply({loyalty:-4,mood:-6}); else apply({mood:3});
  S.log=(t?t.driver:'Водитель')+' устал ждать и уехал. '+reason;
  return true;
}
function buy(id){
  const it=shop().find(x=>x.id===id); if(!it) return;
  if(S.money<it.price){ S.shopMsg='Не хватает денег. Даже на дошик.'; sfx('bad'); buzzN('error'); save(); render(); return; }
  sfx('shop'); buzz('medium');
  S.money-=it.price;
  const e=Object.assign({},it.effects);
  if(e.drunk>0 && S.food<25) e.drunk+=10;
  apply(e);
  if(pendingSpecial()) return;
  const left=driverLeaves('Пока ты завтракал, очередь рассосалась сама.');
  S.shopMsg=(it.text||it.title)+(left?' Водитель уехал.':' Водитель ждёт.');
  S.log=S.shopMsg;
  save(); render();
}
function closeShop(){ sfx('click'); S.view='hub'; S.shopMsg=''; if(S.progress>=CFG.shift){startInspection();return;} save(); render(); }
function sleepTick(){
  if(S.char!=='sasha') return; sfx('sleep'); buzz('medium');
  S.sleeps++;
  apply({energy:36,drunk:-14,food:-6,mood:10,valeraFatigue:18});
  let n=3, msg=pick(SLEEP_OK);
  if(S.valeraFatigue>80){ n=1; apply({mood:-6,loyalty:-4}); msg=pick(SLEEP_TIRED); }
  else { loyalty(2.6); }
  apply({progress:n});
  if(pendingSpecial()) return;
  S.sleepMsg=msg; S.log=msg; S.view='sleepResult'; save(); render();
}
function sleepMore(){ sfx('click'); S.view='sleep'; S.sleepMsg='Саша снова лёг. Валера тяжело вздохнул и пошёл к весам.'; save(); render(); }
function wake(){ sfx('click'); S.sleepMsg=''; if(S.progress>=CFG.shift){startInspection();return;} S.view='hub'; nextTruck(); save(); render(); }
function smoke(){
  if(S.char!=='valera') return;
  apply({energy:12,mood:9,drunk:-3});
  const left=driverLeaves('Перекур затянулся.');
  if(pendingSpecial()) return;
  S.ev={title:'Перекур',emoji:'🚬',text:left?'Вышел на пять минут, вернулся через семь. Водитель уже уехал, очередь вздохнула.':'Вышел на пять минут, вернулся через семь. Но кто тут считает.'};
  S.view='event'; S.log='Перекур. Мир на пять минут стал нормальным.'; sfx('event'); save(); render();
}
function choose(i){
  if(S.view!=='choice'||!S.ev) return;
  const list=choicesFor(S.ev); const o=list[i]; if(!o) return;
  sfx('click'); buzz('medium');
  const evId=S.ev.id||'';
  if(/gulya/i.test(evId) && /Съесть|Выпить/i.test(o.label||'')) S.ateGulya=true;
  if(o.effects) apply(o.effects);
  let extra='';
  if(o.gamble){
    const win=maybe(o.gamble.chance);
    apply(win?o.gamble.success:o.gamble.fail);
    extra=' '+(win?o.gamble.win:o.gamble.lose);
    if(!win){ sfx('bad'); shake(); } else sfx('coin');
  }
  if(pendingSpecial()) return;
  if(o.next){ const nx=findEv(o.next); if(nx){ showEv(nx); return; } }
  const inspection=S.ev.inspection;
  S.ev={title:o.resultTitle||'Итог',emoji:o.resultEmoji||'✅',text:(o.resultText||o.label||'Что-то произошло.')+extra,endAfter:!!inspection};
  S.view='event'; S.log=S.ev.text; save(); render();
}
function cont(){
  sfx('click'); buzz('light');
  if(S.ev&&S.ev.endAfter){ finish(); return; }
  S.ev=null;
  if(S.progress>=CFG.shift){ startInspection(); return; }
  S.view='hub'; nextTruck(); save(); render();
}

function goalsDone(){ return S.goals.filter(id=>{const g=GOALS.find(x=>x.id===id); return g&&g.f(S);}).length; }
function finish(){
  const done=goalsDone();
  const bonus=done*1800;
  if(bonus){ S.money+=bonus; }
  let kind='mid', text='';
  const dead = S.loyalty<=0 || S.mistakes>=9 || S.theftTons>=230;
  if(S.char==='sasha'){
    if(dead){ kind='bad'; text='Плохая концовка. Начальство приехало лично, склад плачет, песок исчез. Саша первым написал заявление — говорит, сам захотел.'; }
    else if(S.sleeps>=5 && S.loyalty>=62){ kind='secret'; text='СЕКРЕТНАЯ: «Спящий гений». Он проспал половину вахты, но по отчётам — лучший весовщик объекта. Никто так и не понял, как.'; }
    else if(done>=2 && S.money>=14000){ kind='good'; text='Хорошая концовка. Задачи закрыты, деньги есть, Валера устал, начальство довольно. Классический Саша.'; }
    else { kind='mid'; text='Обычная концовка. Никто не понял, что он делал, но смена закрыта и кошелёк не пустой.'; }
  }else{
    if(dead){ kind='bad'; text='Плохая концовка. Начальник участка орал так, что весы обнулились. Валера ушёл в закат, захватив кружку и достоинство.'; }
    else if(S.loyalty>=68 && S.mistakes<=2 && S.theftTons<=20){ kind='good'; text='Хорошая концовка. Взвесил всё, починил всё, никого не подставил. Единственный человек на объекте, которому можно доверять.'; }
    else if(S.bribes>=6 && S.money>=18000){ kind='secret'; text='СЕКРЕТНАЯ: «Тихий омут». Валера всю жизнь был правильным, а потом просто перестал. И оказался в этом подозрительно хорош.'; }
    else { kind='mid'; text='Обычная концовка. Спина болит, 1С висит, премия «в следующем месяце». Но смену он снова вытащил.'; }
  }
  S.endKind=kind; S.endText=text; S.endBonus=bonus; S.screen='end';
  sfx(kind==='bad'?'boss':'win'); buzzN(kind==='bad'?'error':'success'); save(); render();
}

   '<div class="stat s-money"><small>💰 Деньги</small><b>'+Math.round(S.money)+' ₽</b></div>'+
   '<div class="stat s-loy"><small>📈 Лояльность</small><b>'+Math.round(S.loyalty)+'%</b>'+statBar(S.loyalty)+'</div>'+

function renderGoals(){
  return '<div class="goals">'+S.goals.map(id=>{const g=GOALS.find(x=>x.id===id); if(!g) return '';
    const ok=g.f(S); return '<div class="goal'+(ok?' done':'')+'">'+(ok?'✓ ':'○ ')+g.t+'</div>';}).join('')+'</div>';
}
function cardArt(em){ return '<div class="card-art"><span class="beam"></span>'+em+'</div>'; }
function truckCard(){
  const t=getTruck(); if(!t) return '<div class="card">'+cardArt('🌫')+'<div class="card-body"><div class="card-title">Тишина на весах</div><div class="card-text">Пока никто не едет. Подозрительно.</div></div></div>';
  const m=mem(t);
  const chips=['<span class="chip info">'+t.cargo+' • '+t.weight+' т</span>',
    '<span class="chip">'+(t.brand+(t.model?' '+t.model:''))+'</span>',
    t.plate?'<span class="chip">'+t.plate+'</span>':'',

    m.met>1?'<span class="chip">встреча №'+m.met+'</span>':''].filter(Boolean).join('');

  else if(m.gifts>0) extra='В прошлый раз он оставил тебе подарок. Хороший мужик.';

    '<div class="card-body">'+
      '<div class="card-sub">'+phaseName()+' • рейс '+(S.progress+1)+'</div>'+
      '<div class="card-title">'+t.brand+(t.model?' <span style="color:var(--muted);font-size:17px">'+t.model+'</span>':'')+'</div>'+

function actionsHTML(){

function currentCard(){

  return '<div class="hero"><h1>Весовщики:<br><span>Мираж</span></h1><p>Вахта, 1С, шестьдесят самосвалов за смену. Песок налево, обед от Гули, дядя Слава с бутылкой и начальник участка, который приезжает в самый неподходящий момент.</p></div>'+
   '<div class="actions">'+CHARS.map(c=>'<button class="'+(c.id==='sasha'?'b-rest':'b-work')+'" onclick="newShift(\''+c.id+'\')">'+c.emoji+' '+c.name+'<small>'+c.desc+'</small></button>').join('')+'</div>'+
   '<div class="grid2"><button class="b-ghost" onclick="openRules()">📖 Правила</button><button class="b-info" onclick="goFullscreen()">⛶ Во весь экран</button></div>'+
   '<div class="actions">'+rs.map(r=>'<div class="rule">'+r+'</div>').join('')+'</div>';
}
function renderRules(){
  const rs=rulesPool();
  return '<div class="hero"><h1 style="font-size:26px">Правила <span>объекта</span></h1><p>Всё, что нужно знать, прежде чем нажать «Выполнить».</p></div>'+
    '<div class="actions">'+rs.map((r,i)=>'<div class="rule"><b>'+String(i+1).padStart(2,'0')+'</b>'+r+'</div>').join('')+'</div>'+
    '<button class="b-work" onclick="toStart()">Понятно</button>';
}
function renderEnd(){
  const done=goalsDone();
  const cls={good:'end-good',bad:'end-bad',mid:'end-mid',secret:'end-secret'}[S.endKind||'mid'];
  const lbl={good:'Смена вытянута',bad:'Првал',mid:'Смена закрыта',secret:'Секретная концовка'}[S.endKind||'mid'];
  return '<div class="hero"><span class="badge-end '+cls+'">'+lbl+'</span><h1 style="margin-top:10px;font-size:28px">Смена окончена</h1><p>'+(S.endText||'')+'</p></div>'+
   '<div class="rule"><div class="rows">'+
   '<div><span>Машины</span><b>'+S.progress+'/'+CFG.shift+'</b></div>'+
   '<div><span>Деньги</span><b>'+Math.round(S.money)+' ₽</b></div>'+
   '<div><span>Бонус за задачи ('+done+'/3)</span><b>+'+(S.endBonus||0)+' ₽</b></div>'+
   '<div><span>Лояльность начальства</span><b>'+Math.round(S.loyalty)+'%</b></div>'+
   '<div><span>Воровство</span><b>'+Math.round(S.theftTons)+' т</b></div>'+
   '<div><span>Честных / муток</span><b>'+S.honest+' / '+S.bribes+'</b></div>'+
   '<div><span>Косяки</span><b>'+S.mistakes+'</b></div>'+
   '<div><span>Опьянение / бодрость</span><b>'+Math.round(S.drunk)+'% / '+Math.round(S.energy)+'%</b></div>'+
   (S.char==='sasha'?'<div><span>Сны</span><b>'+S.sleeps+'</b></div>':'')+
   '</div></div>'+
   '<div class="goals">'+S.goals.map(id=>{const g=GOALS.find(x=>x.id===id);if(!g)return '';const ok=g.f(S);return '<div class="goal'+(ok?' done':'')+'">'+(ok?'✓ ':'✕ ')+g.t+'</div>';}).join('')+'</div>'+
   '<div class="rule">'+pick(rulesPool())+'</div>'+
   '<div class="grid2"><button class="b-work" onclick="newShift(\''+S.char+'\')">Ещё смена</button><button class="b-ghost" onclick="toStart()">Сменить весовщика</button></div>';
}
const PHASES=[{t:'Ищу песок',e:'🔍'},{t:'Нахожу песок',e:'🏜'},{t:'Жую песок',e:'🥪'},{t:'Типичная вахта',e:'🌙'}];
function renderLoader(){
  const p=PHASES[Math.min(S.loaderPhase,PHASES.length-1)];
  const w=Math.min(100,((S.loaderPhase+1)/PHASES.length)*100);
  return '<div class="loader"><div class="em">'+p.e+'</div><h2>Объект «Мираж»</h2><div class="ph">'+p.t+'</div><div class="track"><i style="width:'+w+'%"></i></div><div class="hint">Разогреваем весы и запускаем 1С…</div></div>';
}
function render(){
  const box=document.getElementById('scroll'); if(!box) return;
  if(S.screen==='game'&&!char()) S.screen='start';
  let html='';
  if(S.screen==='loading') html=renderLoader();
  else if(S.screen==='start') html=renderStart();
  else if(S.screen==='rules') html=renderRules();
  else if(S.screen==='end') html=renderEnd();
  else html=renderGame();
  box.innerHTML=html; box.scrollTop=0; paintTop(); syncViewport();
}

/* ============ CONTENT LOAD ============ */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function uniq(a){ const seen={}; return (a||[]).filter(x=>{ const k=x&&x.id?x.id:JSON.stringify(x); if(seen[k])return false; seen[k]=1; return true; }); }
async function boot(){
  const jobs=[];
  for(let i=1;i<=MAXFILES;i++){
    jobs.push(loadScript('cards-'+i+'.js').catch(()=>{}));
    jobs.push(loadScript('events-'+i+'.js').catch(()=>{}));
    jobs.push(loadScript('shop-'+i+'.js').catch(()=>{}));
    jobs.push(loadScript('rules-'+i+'.js').catch(()=>{}));
  }
  await Promise.all(jobs);
  window.TRUCKS=uniq(window.TRUCKS); window.EVENTS=uniq(window.EVENTS); window.SHOP=uniq(window.SHOP); window.RULES=uniq(window.RULES);
  loadSave(); paintTop();
  S.screen='loading'; S.loaderPhase=0; render();
  const iv=setInterval(()=>{
    S.loaderPhase++; sfx('tick');
    if(S.loaderPhase>=PHASES.length){ clearInterval(iv); S.screen='start'; save(); render(); }
    else render();
  },1000);
}
boot();
</script>
</body>
</html>
